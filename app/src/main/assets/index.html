        // DEALS SCREEN (With Real OCR)
        function DealsScreen({ deals, setDeals, onBack, onDealsScanned, hideBackButton }) {
            const [showScanner, setShowScanner] = useState(false);
            const [scannedPhotos, setScannedPhotos] = useState([]);
            const [pendingDeals, setPendingDeals] = useState([]);
            const [selectedStore, setSelectedStore] = useState('Safeway');
            const [selectedDeal, setSelectedDeal] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [ocrProgress, setOcrProgress] = useState(0);
            const [rawOcrText, setRawOcrText] = useState('');
            const [showRawText, setShowRawText] = useState(false);
            const fileInputRef = useRef(null);

            // Handle file selection (camera or gallery)
            const handleFileSelect = (e) => {
                const files = Array.from(e.target.files);
                files.forEach(file => {
                    if (scannedPhotos.length >= 6) return;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setScannedPhotos(prev => [...prev, {
                            id: Date.now() + Math.random(),
                            dataUrl: event.target.result,
                            file: file
                        }]);
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = ''; // Reset input
            };

            const removePhoto = (id) => {
                setScannedPhotos(prev => prev.filter(p => p.id !== id));
            };

            // Process images with Claude Vision API
            const processPhotosWithOCR = async () => {
                setIsProcessing(true);
                setOcrProgress(0);
                setRawOcrText('');
                
                let allDeals = [];
                const totalPhotos = scannedPhotos.length;
                
                for (let i = 0; i < scannedPhotos.length; i++) {
                    const photo = scannedPhotos[i];
                    const baseProgress = Math.round((i / totalPhotos) * 100);
                    
                    try {
                        setRawOcrText(prev => prev + `\n🤖 Processing image ${i + 1} of ${totalPhotos} with AI Vision...\n`);
                        
                        const deals = await processImageWithAIVision(
                            photo.dataUrl, 
                            selectedStore,
                            (progress) => {
                                setOcrProgress(Math.round(baseProgress + (progress / totalPhotos)));
                            }
                        );
                        
                        setRawOcrText(prev => prev + `✅ Found ${deals.length} deals in image ${i + 1}\n`);
                        allDeals = [...allDeals, ...deals];
                        
                    } catch (err) {
                        console.error('AI Vision failed for image', i, err);
                        
                        setRawOcrText(prev => prev + `⚠️ Error on image ${i + 1}: ${err.message}\nFalling back to Tesseract OCR...\n`);
                        
                        // Fallback to Tesseract
                        try {
                            const text = await processImageWithOCR(photo.dataUrl, (progress) => {
                                setOcrProgress(Math.round(baseProgress + (progress / totalPhotos)));
                            });
                            setRawOcrText(prev => prev + `OCR Text:\n${text}\n`);
                            const fallbackDeals = parseOCRText(text, selectedStore);
                            allDeals = [...allDeals, ...fallbackDeals];
                        } catch (fallbackErr) {
                            console.error('Tesseract also failed', fallbackErr);
                        }
                    }
                }
                
                setOcrProgress(100);
                
                // Deduplicate deals by item name
                const uniqueDeals = [];
                const seen = new Set();
                for (const deal of allDeals) {
                    const key = deal.item.toLowerCase() + deal.price;
                    if (!seen.has(key)) {
                        seen.add(key);
                        uniqueDeals.push(deal);
                    }
                }
                
                setPendingDeals(uniqueDeals);
                setIsProcessing(false);
                
                if (uniqueDeals.length > 0) {
                    setRawOcrText(prev => prev + `\n🎉 Total: ${uniqueDeals.length} unique deals extracted!`);
                }
            };

            // Use demo data (for testing without camera)
            const useDemoData = () => {
                const extracted = simulateOCR(selectedStore.toLowerCase());
                setPendingDeals(extracted);
            };

            const confirmDeals = () => {
                const otherStoreDeals = deals.filter(d => d.store.toLowerCase() !== selectedStore.toLowerCase());
                setDeals([...otherStoreDeals, ...pendingDeals]);
                setPendingDeals([]);
                setScannedPhotos([]);
                setRawOcrText('');
                setShowScanner(false);
                
                // Trigger recipe discovery after scanning deals
                if (onDealsScanned && pendingDeals.length > 0) {
                    setTimeout(() => onDealsScanned(), 500); // Small delay for state to settle
                }
            };

            const updatePendingDeal = (id, field, value) => {
                setPendingDeals(prev => prev.map(d => 
                    d.id === id ? { ...d, [field]: field === 'price' ? parseFloat(value) || 0 : value } : d
                ));
            };

            const removePendingDeal = (id) => {
                setPendingDeals(prev => prev.filter(d => d.id !== id));
            };

            const deleteDeal = (id) => {
                setDeals(deals.filter(d => d.id !== id));
                setSelectedDeal(null);
            };

            const getCouponsThatNeedClipping = () => {
                return deals.filter(d => (d.type === 'DIGITAL_COUPON' || d.type === 'PAPER_COUPON') && !d.couponClipped);
            };

            const couponsToClip = getCouponsThatNeedClipping();

            return (
                <div>
                    {!hideBackButton && <button className="btn-back" onClick={onBack}>← Back</button>}
                    <h2>🏷️ Deals Manager</h2>

                    {/* Coupon Reminder */}
                    {couponsToClip.length > 0 && (
                        <div className="coupon-checklist">
                            <h4 style={{margin:'0 0 10px 0', color:'#7b1fa2'}}>
                                <i className="fas fa-cut"></i> Coupons to Clip ({couponsToClip.length})
                            </h4>
                            {couponsToClip.map(deal => (
                                <div key={deal.id} className="coupon-item">
                                    <input 
                                        type="checkbox" 
                                        checked={deal.couponClipped}
                                        onChange={() => {
                                            setDeals(deals.map(d => d.id === deal.id ? {...d, couponClipped: true} : d));
                                        }}
                                    />
                                    <div style={{flex:1}}>
                                        <strong>{deal.item}</strong>
                                        <div style={{fontSize:'0.85em', color:'#666'}}>
                                            {deal.type === 'DIGITAL_COUPON' ? '📱 Clip in Safeway app' : '📰 Cut from flyer'}
                                        </div>
                                    </div>
                                    <span style={{color:'#4caf50', fontWeight:'bold'}}>${deal.price}</span>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Scan New Flyer Button */}
                    <button 
                        onClick={() => setShowScanner(true)}
                        style={{width:'100%', padding:'20px', background:'linear-gradient(135deg, #9c27b0, #673ab7)', color:'white', fontSize:'1.1em', marginBottom:'15px'}}
                    >
                        <i className="fas fa-robot"></i> 🤖 Scan Flyer with AI
                    </button>

                    {/* Current Deals */}
                    {deals.length === 0 ? (
                        <p style={{textAlign:'center', color:'#888'}}>No deals yet. Scan a flyer to get started!</p>
                    ) : (
                        deals.map(deal => (
                            <div key={deal.id} className="card-light" onClick={() => setSelectedDeal(deal)} style={{cursor:'pointer'}}>
                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                                    <div>
                                        <strong>{deal.item}</strong>
                                        <div style={{marginTop:'5px'}}>
                                            {deal.type === 'SALE' && <span className="tag tag-sale">SALE</span>}
                                            {deal.type === 'MEMBER' && <span className="tag tag-member">MEMBER PRICE</span>}
                                            {deal.type === 'DIGITAL_COUPON' && <span className="tag tag-coupon">📱 DIGITAL COUPON</span>}
                                            {deal.type === 'PAPER_COUPON' && <span className="tag tag-coupon">📰 PAPER COUPON</span>}
                                        </div>
                                        <div style={{fontSize:'0.85em', color:'#666', marginTop:'5px'}}>
                                            {deal.store} • {deal.note}
                                        </div>
                                    </div>
                                    <div style={{textAlign:'right'}}>
                                        <div style={{fontSize:'1.3em', fontWeight:'bold', color:'#4caf50'}}>${deal.price}</div>
                                        <div style={{fontSize:'0.85em', color:'#888'}}>/{deal.unit}</div>
                                    </div>
                                </div>
                            </div>
                        ))
                    )}

                    {/* Deal Detail Modal */}
                    {selectedDeal && (
                        <div className="modal-overlay" onClick={() => setSelectedDeal(null)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <h3 style={{marginTop:0}}>{selectedDeal.item}</h3>
                                
                                <div style={{fontSize:'2em', fontWeight:'bold', color:'#4caf50', textAlign:'center', margin:'15px 0'}}>
                                    ${selectedDeal.price}<span style={{fontSize:'0.5em', color:'#888'}}>/{selectedDeal.unit}</span>
                                </div>
                                
                                <div style={{background:'#f5f5f5', padding:'15px', borderRadius:'8px', marginBottom:'15px'}}>
                                    <div style={{marginBottom:'10px'}}>
                                        <strong>Store:</strong> {selectedDeal.store}
                                    </div>
                                    {selectedDeal.note && (
                                        <div style={{marginBottom:'10px'}}>
                                            <strong>Note:</strong> {selectedDeal.note}
                                        </div>
                                    )}
                                    <div>
                                        <strong>Type:</strong> {selectedDeal.type === 'SALE' && 'Regular Sale Price'}
                                        {selectedDeal.type === 'MEMBER' && 'Member/Loyalty Card Price'}
                                        {selectedDeal.type === 'DIGITAL_COUPON' && 'Digital Coupon'}
                                        {selectedDeal.type === 'PAPER_COUPON' && 'Paper Coupon'}
                                    </div>
                                </div>

                                {/* Explicit Coupon Instructions */}
                                {selectedDeal.type === 'DIGITAL_COUPON' && (
                                    <div style={{background:'#e8f5e9', padding:'15px', borderRadius:'8px', marginBottom:'15px', border:'2px solid #4caf50'}}>
                                        <div style={{fontSize:'1.2em', fontWeight:'bold', color:'#2e7d32', marginBottom:'10px'}}>
                                            📱 Digital Coupon Required
                                        </div>
                                        <div style={{color:'#333'}}>
                                            <strong>How to get this deal:</strong>
                                            <ol style={{margin:'10px 0', paddingLeft:'20px'}}>
                                                <li>Open the <strong>{selectedDeal.store} app</strong> on your phone</li>
                                                <li>Go to "Coupons" or "Just for U" section</li>
                                                <li>Search for "{selectedDeal.item}"</li>
                                                <li>Tap to <strong>clip the coupon</strong></li>
                                                <li>Use your loyalty card at checkout</li>
                                            </ol>
                                        </div>
                                        {!selectedDeal.couponClipped && (
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    setDeals(deals.map(d => d.id === selectedDeal.id ? {...d, couponClipped: true} : d));
                                                    setSelectedDeal({...selectedDeal, couponClipped: true});
                                                }}
                                                style={{width:'100%', padding:'12px', background:'#4caf50', color:'white', marginTop:'10px'}}
                                            >
                                                ✓ Mark as Clipped
                                            </button>
                                        )}
                                        {selectedDeal.couponClipped && (
                                            <div style={{textAlign:'center', color:'#4caf50', fontWeight:'bold', marginTop:'10px'}}>
                                                ✓ Coupon Clipped!
                                            </div>
                                        )}
                                    </div>
                                )}

                                {selectedDeal.type === 'PAPER_COUPON' && (
                                    <div style={{background:'#fff3e0', padding:'15px', borderRadius:'8px', marginBottom:'15px', border:'2px solid #ff9800'}}>
                                        <div style={{fontSize:'1.2em', fontWeight:'bold', color:'#e65100', marginBottom:'10px'}}>
                                            📰 Paper Coupon Required
                                        </div>
                                        <div style={{color:'#333'}}>
                                            <strong>How to get this deal:</strong>
                                            <ol style={{margin:'10px 0', paddingLeft:'20px'}}>
                                                <li>Find the <strong>weekly ad flyer</strong> (in-store or mailed)</li>
                                                <li>Locate the coupon for "{selectedDeal.item}"</li>
                                                <li><strong>Cut out the coupon</strong> with scissors</li>
                                                <li>Bring it to the store</li>
                                                <li>Hand it to the cashier at checkout</li>
                                            </ol>
                                        </div>
                                        {!selectedDeal.couponClipped && (
                                            <button 
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    setDeals(deals.map(d => d.id === selectedDeal.id ? {...d, couponClipped: true} : d));
                                                    setSelectedDeal({...selectedDeal, couponClipped: true});
                                                }}
                                                style={{width:'100%', padding:'12px', background:'#ff9800', color:'white', marginTop:'10px'}}
                                            >
                                                ✓ Mark as Cut Out
                                            </button>
                                        )}
                                        {selectedDeal.couponClipped && (
                                            <div style={{textAlign:'center', color:'#ff9800', fontWeight:'bold', marginTop:'10px'}}>
                                                ✓ Coupon Cut Out!
                                            </div>
                                        )}
                                    </div>
                                )}

                                {selectedDeal.type === 'MEMBER' && (
                                    <div style={{background:'#fff8e1', padding:'15px', borderRadius:'8px', marginBottom:'15px', border:'2px solid #ffc107'}}>
                                        <div style={{fontSize:'1.2em', fontWeight:'bold', color:'#f57f17', marginBottom:'10px'}}>
                                            💳 Loyalty Card Required
                                        </div>
                                        <div style={{color:'#333'}}>
                                            Scan your <strong>{selectedDeal.store} loyalty card</strong> or enter your phone number at checkout to get this price.
                                        </div>
                                    </div>
                                )}

                                <div style={{display:'flex', gap:'10px'}}>
                                    <button 
                                        onClick={() => deleteDeal(selectedDeal.id)}
                                        style={{flex:1, padding:'12px', background:'#ffcdd2', color:'#c62828'}}
                                    >
                                        Delete Deal
                                    </button>
                                    <button 
                                        onClick={() => setSelectedDeal(null)}
                                        style={{flex:1, padding:'12px', background:'#2196f3', color:'white'}}
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Scanner Modal */}
                    {showScanner && (
                        <div className="modal-overlay">
                            <div className="modal-content" style={{maxWidth:'500px', maxHeight:'90vh', overflow:'auto'}}>
                                <h3><i className="fas fa-robot"></i> AI Flyer Scanner</h3>
                                
                                <label style={{fontSize:'0.9em', fontWeight:'bold'}}>Store:</label>
                                <select value={selectedStore} onChange={e => setSelectedStore(e.target.value)}>
                                    <option value="Safeway">Safeway</option>
                                    <option value="Kroger">Kroger</option>
                                    <option value="WinCo">WinCo</option>
                                    <option value="Walmart">Walmart</option>
                                    <option value="Target">Target</option>
                                    <option value="Costco">Costco</option>
                                    <option value="Other">Other</option>
                                </select>

                                {/* Hidden file input for web fallback */}
                                <input 
                                    type="file" 
                                    ref={fileInputRef}
                                    accept="image/*"
                                    multiple
                                    onChange={handleFileSelect}
                                    style={{display:'none'}}
                                />

                                {/* Photo capture buttons - native or web */}
                                {isAndroidApp() ? (
                                    <div style={{display:'flex', gap:'10px', marginBottom:'15px'}}>
                                        <button 
                                            onClick={async () => {
                                                if (scannedPhotos.length >= 6) return;
                                                const dataUrl = await openNativeCamera();
                                                if (dataUrl) {
                                                    setScannedPhotos(prev => [...prev, {
                                                        id: Date.now() + Math.random(),
                                                        dataUrl: dataUrl
                                                    }]);
                                                }
                                            }}
                                            style={{flex:1, padding:'15px', background:'#4caf50', color:'white'}}
                                            disabled={isProcessing || scannedPhotos.length >= 6}
                                        >
                                            <i className="fas fa-camera"></i> Camera
                                        </button>
                                        <button 
                                            onClick={async () => {
                                                if (scannedPhotos.length >= 6) return;
                                                const dataUrl = await openNativeGallery();
                                                if (dataUrl) {
                                                    setScannedPhotos(prev => [...prev, {
                                                        id: Date.now() + Math.random(),
                                                        dataUrl: dataUrl
                                                    }]);
                                                }
                                            }}
                                            style={{flex:1, padding:'15px', background:'#2196f3', color:'white'}}
                                            disabled={isProcessing || scannedPhotos.length >= 6}
                                        >
                                            <i className="fas fa-images"></i> Gallery
                                        </button>
                                    </div>
                                ) : (
                                    <div style={{display:'flex', gap:'10px', marginBottom:'15px'}}>
                                        <button 
                                            onClick={() => fileInputRef.current?.click()}
                                            style={{flex:1, padding:'15px', background:'linear-gradient(135deg, #4caf50, #2196f3)', color:'white'}}
                                            disabled={isProcessing || scannedPhotos.length >= 6}
                                        >
                                            <i className="fas fa-camera"></i> Add Photo
                                        </button>
                                    </div>
                                )}

                                {/* Photo previews */}
                                {scannedPhotos.length > 0 && (
                                    <div style={{marginBottom:'15px'}}>
                                        <div style={{fontSize:'0.9em', marginBottom:'5px'}}>{scannedPhotos.length}/6 photos</div>
                                        <div className="camera-grid">
                                            {scannedPhotos.map((photo) => (
                                                <div key={photo.id} className="camera-thumb" style={{position:'relative'}}>
                                                    <img src={photo.dataUrl} alt="Flyer" style={{width:'100%', height:'100%', objectFit:'cover'}} />
                                                    <button 
                                                        onClick={() => removePhoto(photo.id)}
                                                        style={{position:'absolute', top:'2px', right:'2px', background:'#f44336', color:'white', borderRadius:'50%', width:'24px', height:'24px', padding:0, fontSize:'0.8em'}}
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Processing status */}
                                {isProcessing && (
                                    <div style={{marginBottom:'15px'}}>
                                        <div style={{display:'flex', justifyContent:'space-between', marginBottom:'5px'}}>
                                            <span>🤖 Claude AI is reading your flyer...</span>
                                            <span>{ocrProgress}%</span>
                                        </div>
                                        <div style={{background:'#eee', borderRadius:'4px', height:'20px', overflow:'hidden'}}>
                                            <div style={{background:'linear-gradient(90deg, #4caf50, #8bc34a)', height:'100%', width:`${ocrProgress}%`, transition:'width 0.3s'}}></div>
                                        </div>
                                        <div style={{fontSize:'0.8em', color:'#666', marginTop:'5px'}}>
                                            This usually takes 5-15 seconds per image...
                                        </div>
                                    </div>
                                )}

                                {/* Process button */}
                                {scannedPhotos.length > 0 && !isProcessing && pendingDeals.length === 0 && (
                                    <button 
                                        onClick={processPhotosWithOCR} 
                                        style={{width:'100%', padding:'15px', background:'linear-gradient(135deg, #9c27b0, #673ab7)', color:'white', marginBottom:'10px', fontSize:'1.1em'}}
                                    >
                                        <i className="fas fa-magic"></i> 🤖 Scan with AI Vision ({scannedPhotos.length} Photo{scannedPhotos.length > 1 ? 's' : ''})
                                    </button>
                                )}

                                {/* Demo data button */}
                                {!isProcessing && pendingDeals.length === 0 && (
                                    <button 
                                        onClick={useDemoData} 
                                        style={{width:'100%', padding:'10px', background:'#eee', color:'#666', marginBottom:'15px'}}
                                    >
                                        Or use demo data (no camera needed)
                                    </button>
                                )}

                                {/* Raw OCR text toggle */}
                                {rawOcrText && (
                                    <div style={{marginBottom:'15px'}}>
                                        <button 
                                            onClick={() => setShowRawText(!showRawText)}
                                            style={{width:'100%', padding:'8px', background:'#f5f5f5', color:'#666', fontSize:'0.85em'}}
                                        >
                                            {showRawText ? '▼ Hide' : '▶ Show'} Raw OCR Text (for debugging)
                                        </button>
                                        {showRawText && (
                                            <div style={{background:'#1e1e1e', color:'#0f0', padding:'10px', borderRadius:'4px', maxHeight:'150px', overflow:'auto', fontSize:'0.75em', fontFamily:'monospace', marginTop:'5px'}}>
                                                <pre style={{margin:0, whiteSpace:'pre-wrap'}}>{rawOcrText}</pre>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* No deals found - offer manual entry */}
                                {rawOcrText && pendingDeals.length === 0 && !isProcessing && (
                                    <div style={{background:'#fff3e0', padding:'15px', borderRadius:'8px', marginBottom:'15px', border:'2px solid #ff9800'}}>
                                        <div style={{fontSize:'1.1em', fontWeight:'bold', color:'#e65100', marginBottom:'10px'}}>
                                            ⚠️ AI couldn't extract deals from this image
                                        </div>
                                        <p style={{fontSize:'0.9em', color:'#666', margin:'0 0 10px'}}>
                                            This might happen if the image is blurry or has unusual formatting. You can:
                                        </p>
                                        <ul style={{fontSize:'0.85em', color:'#666', margin:'0 0 15px', paddingLeft:'20px'}}>
                                            <li>Add deals manually below</li>
                                            <li>Try a clearer, closer photo</li>
                                            <li>Photo one section of the flyer at a time</li>
                                        </ul>
                                    </div>
                                )}

                                {/* Manual deal entry */}
                                {!isProcessing && (
                                    <div style={{marginBottom:'15px'}}>
                                        <button 
                                            onClick={() => {
                                                const newDeal = {
                                                    id: 'd' + Date.now(),
                                                    item: '',
                                                    price: 0,
                                                    unit: 'ea',
                                                    store: selectedStore,
                                                    type: 'SALE',
                                                    note: 'Manual entry',
                                                    couponClipped: false,
                                                    confidence: 1.0
                                                };
                                                setPendingDeals([...pendingDeals, newDeal]);
                                            }}
                                            style={{width:'100%', padding:'12px', background:'#e3f2fd', color:'#1565c0', border:'2px dashed #2196f3'}}
                                        >
                                            <i className="fas fa-plus"></i> Add Deal Manually
                                        </button>
                                    </div>
                                )}

                                {/* Extracted deals (editable) */}
                                {pendingDeals.length > 0 && (
                                    <div style={{marginBottom:'15px'}}>
                                        <h4 style={{margin:'0 0 10px'}}>
                                            <i className="fas fa-check-circle" style={{color:'#4caf50'}}></i> Found {pendingDeals.length} Deals
                                        </h4>
                                        <p style={{fontSize:'0.85em', color:'#666', margin:'0 0 10px'}}>Review and edit before adding:</p>
                                        <div style={{maxHeight:'250px', overflowY:'auto'}}>
                                            {pendingDeals.map(deal => (
                                                <div key={deal.id} style={{padding:'10px', background:'#f9f9f9', borderRadius:'8px', marginBottom:'8px', border:'1px solid #ddd'}}>
                                                    <div style={{display:'flex', gap:'8px', marginBottom:'8px'}}>
                                                        <input 
                                                            value={deal.item}
                                                            onChange={e => updatePendingDeal(deal.id, 'item', e.target.value)}
                                                            placeholder="Item name"
                                                            style={{flex:2, padding:'8px', fontSize:'0.9em'}}
                                                        />
                                                        <input 
                                                            type="number"
                                                            step="0.01"
                                                            value={deal.price}
                                                            onChange={e => updatePendingDeal(deal.id, 'price', e.target.value)}
                                                            style={{width:'70px', padding:'8px', fontSize:'0.9em'}}
                                                        />
                                                        <select 
                                                            value={deal.unit}
                                                            onChange={e => updatePendingDeal(deal.id, 'unit', e.target.value)}
                                                            style={{width:'60px', padding:'8px', fontSize:'0.9em'}}
                                                        >
                                                            <option value="ea">ea</option>
                                                            <option value="lb">lb</option>
                                                            <option value="oz">oz</option>
                                                            <option value="ct">ct</option>
                                                            <option value="pk">pk</option>
                                                            <option value="gal">gal</option>
                                                        </select>
                                                    </div>
                                                    <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
                                                        <select 
                                                            value={deal.type}
                                                            onChange={e => updatePendingDeal(deal.id, 'type', e.target.value)}
                                                            style={{flex:1, padding:'6px', fontSize:'0.85em'}}
                                                        >
                                                            <option value="SALE">Sale</option>
                                                            <option value="MEMBER">Member Price</option>
                                                            <option value="DIGITAL_COUPON">Digital Coupon</option>
                                                            <option value="PAPER_COUPON">Paper Coupon</option>
                                                        </select>
                                                        <button 
                                                            onClick={() => removePendingDeal(deal.id)}
                                                            style={{padding:'6px 12px', background:'#ffcdd2', color:'#c62828', fontSize:'0.85em'}}
                                                        >
                                                            Remove
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button 
                                            onClick={confirmDeals} 
                                            style={{width:'100%', padding:'15px', background:'#4caf50', color:'white', marginTop:'10px', fontSize:'1.1em'}}
                                        >

        // PLAN SCREEN
        function PlanScreen({ plan, setPlan, recipes, setRecipes, pantry, deals, params, onBack, onRegenerate, onInitiateSwapFromPlan, swapState, shoppingList, setShoppingList }) {
            const [recipeDetail, setRecipeDetail] = useState(null);
            const [showShoppingList, setShowShoppingList] = useState(false);
            
            // Get available ingredients for checking what's missing
            const available = getAvailableIngredients(pantry);
            
            const isIngredientMissing = (ingredient) => {
                const normalized = normalizeIngredient(ingredient);
                return !available.has(normalized);
            };

            const toggleFavorite = (meal) => {
                const exists = recipes.find(r => r.name === meal.name);
                if (exists) {
                    setRecipes(recipes.map(r => r.name === meal.name ? { ...r, favorite: !r.favorite } : r));
                } else {
                    setRecipes([...recipes, { id: Date.now().toString(), name: meal.name, type: meal.type, ingredients: meal.ingredients || [], instructions: 'Added from Plan', favorite: true }]);
                }
            };

            const isFavorite = (name) => recipes.find(x => x.name === name)?.favorite || false;

            const handleMealClick = (meal) => {
                const fullRecipe = recipes.find(r => r.name === meal.name) || { name: meal.name, type: meal.type, ingredients: meal.ingredients || [], instructions: 'Recipe details not yet available.' };
                setRecipeDetail(fullRecipe);
            };

            const hasRecipeToSwap = swapState && swapState.recipe;

            // Generate shopping list from plan
            const generateShoppingList = () => {
                // Get available ingredients from pantry and deals
                const available = getAvailableIngredients(pantry);
                const ingredientMap = {};
                
                plan.forEach(day => {
                    day.meals.forEach(meal => {
                        (meal.ingredients || []).forEach(ing => {
                            // Normalize to check against pantry/deals
                            const normalized = normalizeIngredient(ing);
                            
                            // Skip if we already have this ingredient
                            if (available.has(normalized)) {
                                return;
                            }
                            
                            // Parse ingredient string - try to extract quantity and item
                            const match = ing.match(/^([\d.\/]+)?\s*(cups?|tbsp?|tsp?|oz|lb|lbs?|cans?|bags?|cloves?)?\s*(.+)$/i);
                            
                            if (match) {
                                const qty = match[1] ? parseFloat(match[1].includes('/') ? eval(match[1]) : match[1]) : 1;
                                const unit = match[2] || '';
                                const item = match[3] || ing;
                                const key = normalized;
                                
                                if (ingredientMap[key]) {
                                    // Try to combine quantities if same unit
                                    if (ingredientMap[key].unit === unit) {
                                        ingredientMap[key].qty += qty;
                                    } else {
                                        // Different units, just note it
                                        ingredientMap[key].notes = (ingredientMap[key].notes || '') + `, +${qty} ${unit}`;
                                    }
                                    if (!ingredientMap[key].meals.includes(meal.name)) {
                                        ingredientMap[key].meals.push(meal.name);
                                    }
                                } else {
                                    ingredientMap[key] = {
                                        name: item.charAt(0).toUpperCase() + item.slice(1).toLowerCase(),
                                        qty: qty,
                                        unit: unit,
                                        meals: [meal.name],
                                        checked: false,
                                        normalized: normalized
                                    };
                                }
                            } else {
                                // Couldn't parse, just add as-is
                                const key = normalized;
                                if (!ingredientMap[key]) {
                                    ingredientMap[key] = {
                                        name: ing,
                                        qty: 1,
                                        unit: '',
                                        meals: [meal.name],
                                        checked: false,
                                        normalized: normalized
                                    };
                                } else if (!ingredientMap[key].meals.includes(meal.name)) {
                                    ingredientMap[key].meals.push(meal.name);
                                }
                            }
                        });
                    });
                });
                
                // Convert to array, multiply by household size, and sort alphabetically
                const householdMultiplier = params.householdSize || 1;
                const list = Object.values(ingredientMap)
                    .map(item => ({
                        ...item,
                        qty: Math.ceil(item.qty * householdMultiplier * 10) / 10, // Round up to 1 decimal
                        originalQty: item.qty
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name));
                setShoppingList(list);
                setShowShoppingList(true);
            };

            const toggleShoppingItem = (idx) => {
                setShoppingList(list => list.map((item, i) => 
                    i === idx ? { ...item, checked: !item.checked } : item
                ));
            };

            if (!plan) return (
                <div>
                    <button className="btn-back" onClick={onBack}>← Back</button>
                    <p style={{textAlign:'center', marginTop:'50px', color:'#888'}}>No plan yet. Generate one from the home screen!</p>
                </div>
            );

            return (
                <div>
                    <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'15px'}}>
                        <button className="btn-back" onClick={onBack} style={{marginBottom:0}}>← Back</button>
                    </div>
                    <h2>📅 Weekly Plan</h2>
                    
                    {/* Action buttons at TOP for easy access */}
                    <div style={{display:'flex', gap:'10px', marginBottom:'15px'}}>
                        <button 
                            onClick={() => { if(confirm('Regenerate? This will replace your current plan.')) onRegenerate(); }} 
                            style={{flex:1, padding:'12px', background:'linear-gradient(135deg, #4caf50, #2e7d32)', color:'white', fontSize:'0.95em'}}
                        >
                            <i className="fas fa-sync-alt"></i> Regenerate Plan
                        </button>
                        <button 
                            onClick={generateShoppingList}
                            style={{flex:1, padding:'12px', background:'linear-gradient(135deg, #ff9800, #f57c00)', color:'white', fontSize:'0.95em'}}
                        >
                            <i className="fas fa-shopping-cart"></i> Shopping List
                        </button>
                    </div>
                    
                    {hasRecipeToSwap && (
                        <div className="swap-banner">
                            <i className="fas fa-exchange-alt"></i> Tap a meal to swap in: <strong>{swapState.recipe.name}</strong>
                        </div>
                    )}
                    
                    {plan.map((day, dIdx) => (
                        <div key={dIdx} className="card-light">
                            <div style={{background:'#eee', padding:'8px 10px', fontWeight:'bold', margin:'-15px -15px 10px', borderRadius:'12px 12px 0 0'}}>{day.date}</div>
                            {day.meals.map((meal, mIdx) => (
                                <div key={mIdx} 
                                    onClick={() => hasRecipeToSwap ? onInitiateSwapFromPlan({ dayIdx: dIdx, mealIdx: mIdx }) : handleMealClick(meal)}
                                    style={{
                                        display:'flex', justifyContent:'space-between', alignItems:'center',
                                        borderBottom: mIdx < 2 ? '1px solid #eee' : 'none',
                                        padding:'10px 0', cursor:'pointer',
                                        background: hasRecipeToSwap ? '#e3f2fd' : 'transparent',
                                        borderRadius: hasRecipeToSwap ? '8px' : 0,
                                        margin: hasRecipeToSwap ? '5px -10px' : 0,
                                        padding: hasRecipeToSwap ? '10px' : '10px 0'
                                    }}
                                >
                                    <div>
                                        <div style={{fontSize:'0.8em', color:'#1976d2', fontWeight:'bold'}}>{meal.type}</div>
                                        <div>{meal.name}</div>
                                    </div>
                                    {!hasRecipeToSwap && (
                                        <div style={{display:'flex', gap:'5px'}}>
                                            <button className="btn-icon" onClick={(e) => { e.stopPropagation(); toggleFavorite(meal); }}>
                                                <i className={`fas fa-star ${isFavorite(meal.name) ? 'fav-active' : 'fav-inactive'}`}></i>
                                            </button>

                                            </button>
                                        </div>
                                    )}

                            ))}
                        </div>
                    ))}

                    {/* Shopping List Modal */}
                    {showShoppingList && (
                        <div className="modal-overlay" onClick={() => setShowShoppingList(false)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()} style={{maxHeight:'80vh', overflow:'auto'}}>
                                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'15px'}}>
                                    <h3 style={{margin:0}}>🛒 Shopping List</h3>
                                    <span style={{color:'#888', fontSize:'0.9em'}}>
                                        {shoppingList.filter(i => i.checked).length}/{shoppingList.length} items
                                    </span>
                                </div>
                                
                                <p style={{color:'#666', fontSize:'0.85em', marginBottom:'15px'}}>

        // ============================================
        // RECIPE DISCOVERY - Swipe UI
        // ============================================
        function RecipeDiscoveryScreen({ pantry, deals, params, recipes, setRecipes, onClose, onFinishWithPlan }) {
            const [discoveredRecipes, setDiscoveredRecipes] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isLoading, setIsLoading] = useState(true);
            const [showIngredients, setShowIngredients] = useState(false);
            const [swipeDirection, setSwipeDirection] = useState(null);
            const [stats, setStats] = useState({ kept: 0, skipped: 0 });
            const [keptRecipes, setKeptRecipes] = useState([]);
            const [error, setError] = useState(null);

            // Get available ingredients for checking what's missing
            const available = getAvailableIngredients(pantry);
            
            const isIngredientMissing = (ingredient) => {
                const normalized = normalizeIngredient(ingredient);
                return !available.has(normalized);
            };

            // Generate recipes from AI on mount
            useEffect(() => {
                generateRecipesFromAI();
            }, []);

            const generateRecipesFromAI = async () => {
                setIsLoading(true);
                setError(null);
                
                const backendUrl = getBackendUrl();
                if (!backendUrl) {
                    setError('Backend not configured. Go to Deals → Settings to set up AI.');
                    setIsLoading(false);
                    return;
                }

                // Build ingredient list from pantry + deals
                const pantryItems = pantry.map(p => p.name).slice(0, 30);
                const dealItems = deals.map(d => d.item).slice(0, 20);
                const allIngredients = [...new Set([...pantryItems, ...dealItems])];

                try {
                    const response = await fetch(backendUrl.replace(/\/$/, '') + '/recipes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            ingredients: allIngredients,
                            dietType: params.dietType,
                            allergies: params.allergies,
                            gerdFriendly: params.gerdFriendly,
                            maxComplexity: params.maxComplexity,
                            count: 10  // Request 10 recipes for initial discovery
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Server error: ${response.status}`);
                    }

                    const data = await response.json();
                    if (data.recipes && data.recipes.length > 0) {
                        setDiscoveredRecipes(data.recipes);
                    } else {
                        setError('No recipes generated. Try adding more items to pantry or scanning deals.');
                    }
                } catch (err) {
                    console.error('Recipe generation failed:', err);
                    setError('Failed to generate recipes. Check your backend connection.');
                }
                setIsLoading(false);
            };

            const handleSwipe = (direction) => {
                if (currentIndex >= discoveredRecipes.length) return;
                
                setSwipeDirection(direction);
                const recipe = discoveredRecipes[currentIndex];
                
                setTimeout(() => {
                    if (direction === 'right') {
                        // Save to recipes
                        const newRecipe = {
                            ...recipe,
                            id: 'ai_' + Date.now() + '_' + currentIndex,
                            favorite: true,
                            source: 'AI Discovery'
                        };
                        setRecipes(prev => [...prev, newRecipe]);
                        setKeptRecipes(prev => [...prev, newRecipe]);
                        setStats(prev => ({ ...prev, kept: prev.kept + 1 }));
                    } else {
                        setStats(prev => ({ ...prev, skipped: prev.skipped + 1 }));
                    }
                    
                    setSwipeDirection(null);
                    setCurrentIndex(prev => prev + 1);
                    setShowIngredients(false);
                }, 300);
            };

            const currentRecipe = discoveredRecipes[currentIndex];
            const isFinished = currentIndex >= discoveredRecipes.length && discoveredRecipes.length > 0;

            return (
                <div className="modal-overlay" style={{background:'rgba(0,0,0,0.95)'}}>
                    <div style={{width:'100%', maxWidth:'400px', padding:'20px', textAlign:'center'}}>
                        
                        {/* Header */}
                        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px'}}>
                            <button onClick={onClose} style={{background:'none', border:'none', color:'white', fontSize:'1.5em'}}>
                                <i className="fas fa-times"></i>
                            </button>
                            <h2 style={{margin:0, color:'white'}}>🍳 Discover Recipes</h2>
                            <div style={{color:'#888', fontSize:'0.9em'}}>
                                {currentIndex + 1}/{discoveredRecipes.length}
                            </div>
                        </div>

                        {/* Stats */}
                        <div style={{display:'flex', justifyContent:'center', gap:'20px', marginBottom:'20px'}}>
                            <span style={{color:'#4caf50'}}>✓ {stats.kept} kept</span>
                            <span style={{color:'#f44336'}}>✗ {stats.skipped} skipped</span>
                        </div>

                        {/* Loading */}
                        {isLoading && (
                            <div style={{padding:'60px 20px', color:'white'}}>
                                <i className="fas fa-spinner fa-spin fa-3x" style={{marginBottom:'20px'}}></i>
                                <div>AI is creating recipes from your ingredients...</div>
                                <div style={{fontSize:'0.85em', color:'#888', marginTop:'10px'}}>This takes about 10-15 seconds</div>
                            </div>
                        )}

                        {/* Error */}
                        {error && (
                            <div style={{padding:'40px 20px', color:'#f44336'}}>
                                <i className="fas fa-exclamation-triangle fa-2x" style={{marginBottom:'15px'}}></i>
                                <div>{error}</div>
                                <button 
                                    onClick={generateRecipesFromAI}
                                    style={{marginTop:'20px', padding:'10px 20px', background:'#333', color:'white'}}
                                >
                                    Try Again
                                </button>
                            </div>
                        )}

                        {/* Finished */}
                        {isFinished && (
                            <div style={{padding:'40px 20px', color:'white'}}>

            const currentVersion = localStorage.getItem('app_version');
            if (currentVersion !== APP_VERSION) {
                console.log(`Migrating from ${currentVersion || 'unknown'} to ${APP_VERSION} - clearing all data`);

                const keysToKeep = []; // Nothing to keep
                Object.keys(localStorage).forEach(key => {

                        key.startsWith('recipes_') || key.startsWith('plan_') || 
                        key.startsWith('shoppingList_') || key.startsWith('params_') ||
                        key.startsWith('onboarding_')) {
                        localStorage.removeItem(key);
                    }
                });
                localStorage.setItem('app_version', APP_VERSION);
                // Force reload to start fresh
                window.location.reload();
                return null; // Don't render during reload
            }

                setScreenHistory(prev => [...prev, newScreen]);
                setScreen(newScreen);
                // Push history state for back button
                window.history.pushState({ screen: newScreen, time: Date.now() }, '');
            };
            
            // Go back in history
            const goBack = () => {
                if (screenHistory.length > 1) {
                    const newHistory = [...screenHistory];
                    newHistory.pop(); // Remove current
                    const previousScreen = newHistory[newHistory.length - 1];
                    setScreenHistory(newHistory);
                    setScreen(previousScreen);
                    setSwapState(null);
                    return true;
                }
                return false; // Can't go back further
            };
            
            // Onboarding state
            const [onboardingStep, setOnboardingStep] = useState(() => {
                const completed = localStorage.getItem('onboarding_completed_v69');
                return completed ? null : 0; // null = done, 0 = start
            });
            
            const [onboardingPantryMode, setOnboardingPantryMode] = useState(null); // null, 'voice', or 'receipt'
            
            // Handle Android back button - must be after state declarations
            useEffect(() => {
                // Push history state for navigation tracking
                const pushState = () => {
                    window.history.pushState({ time: Date.now() }, '');
                };
                
                const handleBackButton = (e) => {
                    // During onboarding
                    if (onboardingStep !== null) {
                        if (onboardingPantryMode) {
                            setOnboardingPantryMode(null);
                            pushState();
                            return;
                        } else if (onboardingStep > 0) {
                            setOnboardingStep(prev => prev - 1);
                            pushState();
                            return;
                        }
                        // At step 0, let app close
                        return;
                    }
                    
                    // Discovery modal open
                    if (showDiscovery) {
                        setShowDiscovery(false);
                        pushState();
                        return;
                    }
                    
                    // On a sub-screen, go back to HOME
                    if (screen !== 'HOME') {
                        setSwapState(null);
                        setScreen('HOME');
                        setScreenHistory(['HOME']);
                        pushState();
                        return;
                    }
                    
                    // At HOME - let the app close (don't prevent)
                };
                
                window.addEventListener('popstate', handleBackButton);
                
                // Initial history push
                if (window.history && window.history.state === null) {
                    pushState();
                }
                
                return () => window.removeEventListener('popstate', handleBackButton);
            }, [screen, onboardingStep, onboardingPantryMode, showDiscovery]);
            
            const [pantry, setPantry] = useState(() => {

            const generatePlan = () => {
                // Use recipe matching engine
                const matches = findMatchingRecipes(recipes, pantry, deals, params);
                const newPlan = [];

                // Separate by meal type
                const breakfasts = matches.filter(r => r.type === 'BREAKFAST' && r.canMake);
                const lunches = matches.filter(r => r.type === 'LUNCH' && r.canMake);
                const dinners = matches.filter(r => r.type === 'DINNER' && r.canMake);
                
                // Fallbacks if not enough exact matches
                const breakfastPool = breakfasts.length >= 3 ? breakfasts : matches.filter(r => r.type === 'BREAKFAST' && r.almostCanMake);
                const lunchPool = lunches.length >= 3 ? lunches : matches.filter(r => r.type === 'LUNCH' && r.almostCanMake);
                const dinnerPool = dinners.length >= 3 ? dinners : matches.filter(r => r.type === 'DINNER' && r.almostCanMake);
                
                // Further fallback to all matching recipes if pools are empty
                const finalBreakfastPool = breakfastPool.length > 0 ? breakfastPool : matches.filter(r => r.type === 'BREAKFAST');
                const finalLunchPool = lunchPool.length > 0 ? lunchPool : matches.filter(r => r.type === 'LUNCH');
                const finalDinnerPool = dinnerPool.length > 0 ? dinnerPool : matches.filter(r => r.type === 'DINNER');
                
                const pickRandom = (pool) => pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : null;
                
                for (let i = 0; i < params.planDurationDays; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);
                    
                    const breakfast = pickRandom(finalBreakfastPool);
                    const lunch = pickRandom(finalLunchPool);
                    const dinner = pickRandom(finalDinnerPool);

                    newPlan.push({
                        id: i,
                        date: date.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }),
                        meals: [
                            { ...(breakfast || { name: 'No matching breakfast', ingredients: [], missingIngredients: [] }), type: 'BREAKFAST' },
                            { ...(lunch || { name: 'No matching lunch', ingredients: [], missingIngredients: [] }), type: 'LUNCH' },
                            { ...(dinner || { name: 'No matching dinner', ingredients: [], missingIngredients: [] }), type: 'DINNER' },
                        ]
                    });
                }
                setPlan(newPlan);
            };
            
            // Generate shopping list from current plan
            const generateShoppingListFromPlan = () => {
                if (!plan) return;
                
                const available = getAvailableIngredients(pantry);
                const ingredientMap = {};
                
                plan.forEach(day => {
                    day.meals.forEach(meal => {
                        (meal.ingredients || []).forEach(ing => {
                            const normalized = normalizeIngredient(ing);
                            
                            // Skip if we already have this ingredient
                            if (available.has(normalized)) return;
                            
                            // Parse ingredient string
                            const match = ing.match(/^([\d.\/]+)?\s*(cups?|tbsp?|tsp?|oz|lb|lbs?|cans?|bags?|cloves?)?\s*(.+)$/i);
                            
                            if (match) {
                                const qty = match[1] ? parseFloat(match[1].includes('/') ? eval(match[1]) : match[1]) : 1;
                                const unit = match[2] || '';
                                const item = match[3] || ing;
                                const key = normalized;
                                
                                if (ingredientMap[key]) {
                                    if (ingredientMap[key].unit === unit) {
                                        ingredientMap[key].qty += qty;
                                    } else {
                                        ingredientMap[key].notes = (ingredientMap[key].notes || '') + `, +${qty} ${unit}`;
                                    }
                                    if (!ingredientMap[key].meals.includes(meal.name)) {
                                        ingredientMap[key].meals.push(meal.name);
                                    }
                                } else {
                                    ingredientMap[key] = {
                                        name: item.charAt(0).toUpperCase() + item.slice(1).toLowerCase(),
                                        qty: qty,
                                        unit: unit,
                                        meals: [meal.name],
                                        checked: false,
                                        normalized: normalized
                                    };
                                }
                            } else {
                                const key = normalized;
                                if (!ingredientMap[key]) {
                                    ingredientMap[key] = {
                                        name: ing,
                                        qty: 1,
                                        unit: '',
                                        meals: [meal.name],
                                        checked: false,
                                        normalized: normalized
                                    };
                                } else if (!ingredientMap[key].meals.includes(meal.name)) {
                                    ingredientMap[key].meals.push(meal.name);
                                }
                            }
                        });
                    });
                });
                
                // Convert to array, scale by household size, sort alphabetically
                const householdMultiplier = params.householdSize || 1;
                const list = Object.values(ingredientMap)
                    .map(item => ({
                        ...item,
                        qty: Math.ceil(item.qty * householdMultiplier * 10) / 10
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name));
                    
                setShoppingList(list);
            };

            // Generate plan prioritizing newly discovered recipes
            const generatePlanWithNewRecipes = (newRecipes) => {
                const newPlan = [];
                const today = new Date();
                const days = params.planDurationDays;
                
                // Separate new recipes by type
                const newBreakfasts = newRecipes.filter(r => r.type === 'BREAKFAST');
                const newLunches = newRecipes.filter(r => r.type === 'LUNCH');
                const newDinners = newRecipes.filter(r => r.type === 'DINNER');
                
                // Get existing recipes as fallback
                const allRecipes = [...recipes, ...newRecipes];
                const existingBreakfasts = recipes.filter(r => r.type === 'BREAKFAST');
                const existingLunches = recipes.filter(r => r.type === 'LUNCH');
                const existingDinners = recipes.filter(r => r.type === 'DINNER');
                
                // Create pools - prioritize new recipes, then existing
                const breakfastPool = [...newBreakfasts, ...existingBreakfasts];
                const lunchPool = [...newLunches, ...existingLunches];
                const dinnerPool = [...newDinners, ...existingDinners];
                
                // Track used recipes to maximize variety
                const usedBreakfasts = new Set();
                const usedLunches = new Set();
                const usedDinners = new Set();
                
                const pickWithVariety = (pool, usedSet) => {
                    if (pool.length === 0) return null;
                    
                    // First try to pick unused recipe
                    const unused = pool.filter(r => !usedSet.has(r.name));
                    if (unused.length > 0) {
                        const pick = unused[Math.floor(Math.random() * unused.length)];
                        usedSet.add(pick.name);
                        return pick;
                    }
                    
                    // If all used, reset and pick again
                    usedSet.clear();
                    const pick = pool[Math.floor(Math.random() * pool.length)];
                    usedSet.add(pick.name);
                    return pick;
                };
                
                for (let i = 0; i < days; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);
                    
                    const breakfast = pickWithVariety(breakfastPool, usedBreakfasts);
                    const lunch = pickWithVariety(lunchPool, usedLunches);
                    const dinner = pickWithVariety(dinnerPool, usedDinners);

                    newPlan.push({
                        id: i,
                        date: date.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' }),
