<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ============================================
        // BRAND & UNIT DICTIONARIES FOR PARSING
        // ============================================
        const KNOWN_BRANDS = [
            'heinz', 'del monte', 'dole', 'kraft', 'tyson', 'perdue', 'hormel', 
            'goya', 'birds eye', 'great value', 'kirkland', 'quaker', 'kelloggs',
            'general mills', 'campbells', 'progresso', 'hunts', 'ragu', 'prego',
            'barilla', 'ronzoni', 'oscar mayer', 'hillshire', 'jimmy dean',
            'smucker', 'jif', 'skippy', 'peter pan', 'best foods', 'hellmanns',
            'french', 'hidden valley', 'ranch', 'wishbone', 'newmans own',
            'safeway', 'kroger', 'signature select', 'o organics', 'lucerne'
        ];

        const UNIT_PATTERNS = [
            { pattern: /(\d+\.?\d*)\s*(oz|ounce|ounces)/i, unit: 'oz' },
            { pattern: /(\d+\.?\d*)\s*(lb|lbs|pound|pounds)/i, unit: 'lb' },
            { pattern: /(\d+\.?\d*)\s*(gal|gallon|gallons)/i, unit: 'gal' },
            { pattern: /(\d+\.?\d*)\s*(qt|quart|quarts)/i, unit: 'qt' },
            { pattern: /(\d+\.?\d*)\s*(pt|pint|pints)/i, unit: 'pt' },
            { pattern: /(\d+\.?\d*)\s*(cup|cups)/i, unit: 'cup' },
            { pattern: /(\d+\.?\d*)\s*(ct|count)/i, unit: 'ct' },
            { pattern: /(\d+\.?\d*)\s*(pk|pack|packs)/i, unit: 'pk' },
            { pattern: /(\d+\.?\d*)\s*(can|cans)/i, unit: 'can' },
            { pattern: /(\d+\.?\d*)\s*(box|boxes)/i, unit: 'box' },
            { pattern: /(\d+\.?\d*)\s*(bag|bags)/i, unit: 'bag' },
            { pattern: /(\d+\.?\d*)\s*(jar|jars)/i, unit: 'jar' },
            { pattern: /(\d+\.?\d*)\s*(bottle|bottles)/i, unit: 'bottle' },
            { pattern: /(\d+\.?\d*)\s*(head|heads)/i, unit: 'head' },
            { pattern: /(\d+\.?\d*)\s*(bunch|bunches)/i, unit: 'bunch' },
            { pattern: /(\d+\.?\d*)\s*(loaf|loaves)/i, unit: 'loaf' },
            { pattern: /(\d+\.?\d*)\s*(stick|sticks)/i, unit: 'stick' },
            { pattern: /(\d+\.?\d*)\s*(carton|cartons)/i, unit: 'carton' },
            { pattern: /(\d+\.?\d*)\s*(container|containers)/i, unit: 'container' },
            { pattern: /(\d+\.?\d*)\s*(roll|rolls)/i, unit: 'roll' },
        ];

        const QTY_WORDS = {
            'a': 1, 'an': 1, 'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5,
            'six': 6, 'seven': 7, 'eight': 8, 'nine': 9, 'ten': 10,
            'eleven': 11, 'twelve': 12, 'thirteen': 13, 'fourteen': 14, 'fifteen': 15,
            'twenty': 20, 'thirty': 30,
            'couple': 2, 'few': 3, 'some': 2, 'several': 3, 'half': 0.5,
            'dozen': 12, 'half dozen': 6, 'half a dozen': 6
        };

        const CATEGORY_KEYWORDS = {
            ANCHOR: ['rice', 'pasta', 'oats', 'oatmeal', 'beans', 'lentils', 'flour', 'bread', 'tortilla', 'quinoa', 'noodle', 'cereal', 'grits', 'couscous'],
            PROTEIN: ['chicken', 'beef', 'pork', 'fish', 'salmon', 'tuna', 'egg', 'turkey', 'bacon', 'sausage', 'shrimp', 'tofu', 'ham', 'steak', 'ground', 'meat', 'lamb', 'crab', 'lobster', 'tilapia', 'cod'],
            PRODUCE: ['lettuce', 'tomato', 'onion', 'potato', 'carrot', 'broccoli', 'spinach', 'apple', 'banana', 'orange', 'lemon', 'lime', 'pepper', 'celery', 'cucumber', 'garlic', 'mushroom', 'corn', 'peas', 'berry', 'fruit', 'vegetable', 'peach', 'pear', 'grape', 'melon', 'watermelon', 'strawberry', 'blueberry', 'avocado', 'zucchini', 'squash', 'cabbage', 'kale', 'asparagus', 'green bean'],
            DAIRY: ['milk', 'cheese', 'yogurt', 'butter', 'cream', 'sour cream', 'cottage', 'half and half', 'creamer', 'whipped'],
            STAPLE: ['salt', 'pepper', 'oil', 'vinegar', 'sauce', 'ketchup', 'mustard', 'mayo', 'mayonnaise', 'sugar', 'honey', 'syrup', 'spice', 'broth', 'stock', 'soup', 'salsa', 'dressing', 'seasoning', 'cinnamon', 'vanilla', 'baking']
        };

        // ============================================
        // VOICE PARSER
        // ============================================
        function parseVoiceInput(transcript) {
            const items = [];
            let text = transcript.toLowerCase().trim();
            
            // Strip common speech fillers at the start
            text = text.replace(/^(okay|ok|so|um|uh|let's see|let me see|i have|i've got|there's|there is|we have|we've got|got|looking at)\s+/gi, '');
            
            // Handle "a dozen" and "half dozen" before other processing
            text = text.replace(/half\s+a?\s*dozen/gi, '6');
            text = text.replace(/a\s+dozen/gi, '12');
            text = text.replace(/dozen/gi, '12');
            
            // First, handle spoken dates - convert "November 26th" to "11/26"
            const monthNames = {
                'january': '01', 'february': '02', 'march': '03', 'april': '04',
                'may': '05', 'june': '06', 'july': '07', 'august': '08',
                'september': '09', 'october': '10', 'november': '11', 'december': '12'
            };
            
            // Convert "expires on November 26th" to structured format
            for (const [monthName, monthNum] of Object.entries(monthNames)) {
                const spokenDatePattern = new RegExp(
                    `(?:expires?|exp|expiring)\\s+(?:on\\s+)?${monthName}\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:\\s+(\\d{4}))?`,
                    'gi'
                );
                text = text.replace(spokenDatePattern, (match, day, year) => {
                    const y = year || new Date().getFullYear();
                    return ` exp:${monthNum}/${day}/${y} `;
                });
            }
            
            // Also handle "that expires on" without eating the item name
            text = text.replace(/\s+that\s+expires?\s+/gi, ' exp:');
            
            // Split on item boundaries - look for quantity patterns that start new items
            // Match: "12 oz", "2 cans", "a bag", etc.
            const itemPattern = /(\d+\s*(?:oz|lb|lbs|pound|pounds|can|cans|bag|bags|box|boxes|jar|jars|bottle|bottles|ct|count|pack|pk|gallon|gal|head|heads|bunch|bunches|loaf|loaves)s?\s+(?:of\s+)?)/gi;
            
            // Split by finding positions where a new quantity starts
            let segments = [];
            let lastIndex = 0;
            let match;
            
            // Reset regex
            itemPattern.lastIndex = 0;
            const matches = [...text.matchAll(itemPattern)];
            
            if (matches.length > 0) {
                for (let i = 0; i < matches.length; i++) {
                    const m = matches[i];
                    if (i === 0 && m.index > 0) {
                        // Text before first match
                        const before = text.slice(0, m.index).trim();
                        if (before) segments.push(before);
                    }
                    
                    // Find end of this item (start of next quantity or end of string)
                    const endIndex = i < matches.length - 1 ? matches[i + 1].index : text.length;
                    const segment = text.slice(m.index, endIndex).trim();
                    if (segment) segments.push(segment);
                }
            } else {
                // No quantity patterns found - try splitting on "and", "also"
                segments = text.split(/\s+(?:and|also|then|next)\s+/i)
                    .map(s => s.trim())
                    .filter(s => s.length > 2);
                
                if (segments.length === 0) {
                    segments = [text];
                }
            }
            
            for (let segment of segments) {
                const item = parseItemSegment(segment);
                if (item.name && item.name.length > 1) {
                    items.push(item);
                }
            }
            
            return items;
        }

        function parseItemSegment(segment) {
            let text = segment.trim();
            const result = {
                id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                name: '',
                qty: 1,
                unit: '',
                category: 'STAPLE',
                expiry: '',
                brand: '',
                needsReview: false
            };

            // Extract pre-processed expiry date (exp:MM/DD/YYYY format) - only keep month/year
            const preprocessedExpiry = text.match(/exp:(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
            if (preprocessedExpiry) {
                const month = preprocessedExpiry[1].padStart(2, '0');
                const year = preprocessedExpiry[3];
                result.expiry = `${year}-${month}`;
                text = text.replace(preprocessedExpiry[0], '').trim();
            }

            // Extract standard expiry date formats - only keep month/year
            if (!result.expiry) {
                const expiryPatterns = [
                    /(?:exp(?:ires?)?|bb|best by|use by)[:\s]*(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/i,
                    /(\d{1,2})[\/\-](\d{1,2})[\/\-]?(\d{2,4})?/
                ];
                
                for (const pattern of expiryPatterns) {
                    const match = text.match(pattern);
                    if (match) {
                        const month = match[1].padStart(2, '0');
                        let year = match[3] || new Date().getFullYear().toString();
                        if (year.length === 2) year = '20' + year;
                        result.expiry = `${year}-${month}`;
                        text = text.replace(match[0], '').trim();
                        break;
                    }
                }
            }

            // Extract brand
            for (const brand of KNOWN_BRANDS) {
                if (text.includes(brand)) {
                    result.brand = brand.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    text = text.replace(new RegExp(brand, 'gi'), '').trim();
                    break;
                }
            }

            // Extract quantity with unit
            for (const { pattern, unit } of UNIT_PATTERNS) {
                const match = text.match(pattern);
                if (match) {
                    result.qty = parseFloat(match[1]);
                    result.unit = unit;
                    text = text.replace(match[0], '').trim();
                    break;
                }
            }

            // Extract quantity words if no numeric qty found
            if (result.qty === 1 && !result.unit) {
                for (const [word, num] of Object.entries(QTY_WORDS)) {
                    const wordPattern = new RegExp(`^${word}\\s+|\\s+${word}\\s+`, 'i');
                    if (wordPattern.test(text)) {
                        result.qty = num;
                        text = text.replace(wordPattern, ' ').trim();
                        break;
                    }
                }
            }

            // Try to find standalone unit without qty
            if (!result.unit) {
                const standaloneUnits = ['can', 'box', 'bag', 'jar', 'bottle', 'head', 'bunch', 'loaf'];
                for (const unit of standaloneUnits) {
                    const pattern = new RegExp(`\\b(of\\s+)?${unit}s?\\b`, 'i');
                    if (pattern.test(text)) {
                        result.unit = unit;
                        text = text.replace(pattern, '').trim();
                        break;
                    }
                }
            }

            // Detect category
            const lowerText = text.toLowerCase();
            for (const [category, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
                if (keywords.some(kw => lowerText.includes(kw))) {
                    result.category = category;
                    break;
                }
            }

            // Clean up remaining text as item name
            result.name = text
                .replace(/\s+/g, ' ')
                .replace(/^(of|the|some|a|an)\s+/i, '')
                .trim()
                .split(' ')
                .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                .join(' ');

            // Flag for review if low confidence
            if (result.name.length < 3 || result.name.split(' ').length > 5) {
                result.needsReview = true;
            }

            return result;
        }

        // ============================================
        // REAL OCR PARSER (Tesseract.js)
        // ============================================
        
        // Common grocery items to help with fuzzy matching
        const GROCERY_KEYWORDS = [
            'chicken', 'beef', 'pork', 'turkey', 'salmon', 'fish', 'shrimp', 'meat', 'steak', 'roast', 'ribs', 'tri tip',
            'eggs', 'milk', 'cheese', 'yogurt', 'butter', 'cream', 'lucerne', 'philadelphia',
            'bread', 'pasta', 'rice', 'cereal', 'oats', 'cheerios', 'kellogg', 'artesano', 'rolls',
            'apple', 'banana', 'orange', 'lemon', 'avocado', 'tomato', 'potato', 'grapes', 'navel', 'fuji', 'gala',
            'onion', 'garlic', 'carrot', 'broccoli', 'lettuce', 'spinach', 'corn', 'hass',
            'beans', 'soup', 'sauce', 'salsa', 'ketchup', 'mustard', 'campbell', 'swanson', 'broth',
            'bacon', 'sausage', 'ham', 'deli', 'lunch', 'jimmy', 'dean', 'farmer', 'john', 'oscar', 'mayer',
            'juice', 'soda', 'water', 'coffee', 'tea', 'pepsi', 'coca', 'cola', '7up', 'corona', 'modelo', 'michelob',
            'chips', 'crackers', 'cookies', 'snacks', 'lay', 'cheetos', 'doritos',
            'frozen', 'fresh', 'organic', 'natural', 'ice cream', 'haagen', 'dazs', 'outshine'
        ];

        // Parse OCR text to extract deals - improved for garbled flyer text
        function parseOCRText(text, store) {
            const deals = [];
            
            // Clean up common OCR mistakes
            let cleanedText = text
                .replace(/\|/g, 'l')
                .replace(/§/g, 'S')
                .replace(/[[\]{}]/g, '')
                .replace(/\s+/g, ' ');
            
            // Find all price-like patterns
            const foundPrices = [];
            let match;
            
            // Pattern 1: $X.XX format
            const dollarPattern = /\$\s*(\d{1,2})\s*\.?\s*(\d{2})/g;
            while ((match = dollarPattern.exec(cleanedText)) !== null) {
                foundPrices.push({
                    price: parseFloat(match[1] + '.' + match[2]),
                    index: match.index,
                    raw: match[0]
                });
            }
            
            // Pattern 2: Standalone 3-digit (179, 299, 399, 599 = $1.79, $2.99, etc.)
            const threeDigitPattern = /\b([1-9])(\d{2})\b/g;
            while ((match = threeDigitPattern.exec(cleanedText)) !== null) {
                const price = parseFloat(match[1] + '.' + match[2]);
                // Only if it looks like a grocery price ($0.49 - $19.99)
                if (price >= 0.49 && price <= 19.99) {
                    const isDup = foundPrices.some(p => Math.abs(p.index - match.index) < 15);
                    if (!isDup) {
                        foundPrices.push({
                            price: price,
                            index: match.index,
                            raw: match[0],
                            inferred: true
                        });
                    }
                }
            }
            
            // Pattern 3: X.XX with /lb or /ea nearby
            const decimalUnitPattern = /(\d{1,2})\.(\d{2})\s*(?:\/|per)?\s*(lb|ea)/gi;
            while ((match = decimalUnitPattern.exec(cleanedText)) !== null) {
                const price = parseFloat(match[1] + '.' + match[2]);
                const isDup = foundPrices.some(p => Math.abs(p.index - match.index) < 10);
                if (!isDup) {
                    foundPrices.push({
                        price: price,
                        unit: match[3].toLowerCase(),
                        index: match.index,
                        raw: match[0]
                    });
                }
            }
            
            // For each price, look for nearby grocery keywords
            const lowerText = cleanedText.toLowerCase();
            
            foundPrices.forEach((priceInfo, idx) => {
                // Search 150 chars before and 50 after the price
                const searchStart = Math.max(0, priceInfo.index - 150);
                const searchEnd = Math.min(cleanedText.length, priceInfo.index + 50);
                const context = cleanedText.substring(searchStart, searchEnd).toLowerCase();
                
                let bestMatch = null;
                let bestMatchLength = 0;
                
                for (const keyword of GROCERY_KEYWORDS) {
                    if (context.includes(keyword) && keyword.length > bestMatchLength) {
                        bestMatch = keyword;
                        bestMatchLength = keyword.length;
                    }
                }
                
                if (bestMatch && priceInfo.price > 0 && priceInfo.price < 30) {
                    // Capitalize first letter
                    const itemName = bestMatch.charAt(0).toUpperCase() + bestMatch.slice(1);
                    
                    // Check for /lb indicator
                    let unit = priceInfo.unit || 'ea';
                    if (context.includes('/lb') || context.includes('per lb') || context.includes(' lb')) {
                        unit = 'lb';
                    }
                    
                    // Check deal type
                    let dealType = 'SALE';
                    if (context.includes('member') || lowerText.includes('member price')) {
                        dealType = 'MEMBER';
                    }
                    if (context.includes('clip') || context.includes('click') || context.includes('coupon')) {
                        dealType = 'DIGITAL_COUPON';
                    }
                    
                    // Avoid duplicates
                    const isDup = deals.some(d => 
                        d.item.toLowerCase() === itemName.toLowerCase() && Math.abs(d.price - priceInfo.price) < 0.1
                    );
                    
                    if (!isDup) {
                        deals.push({
                            id: 'd' + Date.now() + idx,

            const backendUrl = getBackendUrl();
            
            if (!backendUrl) {
                throw new Error('NO_BACKEND_URL');
            }
            
            onProgress(10);
            
            // Extract base64 data from data URL
            const base64Data = imageDataUrl.split(',')[1];
            const mediaType = imageDataUrl.split(';')[0].split(':')[1] || 'image/jpeg';
            
            onProgress(20);
            
            const response = await fetch(backendUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    image: base64Data,
                    store: store,
                    mediaType: mediaType
                })
            });
            
            onProgress(70);
            
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Backend error ${response.status}: ${errorText}`);
            }
            
            const data = await response.json();
            
            onProgress(90);
            
            if (data.error) {
                throw new Error(data.error);
            }
            
            if (!data.deals || !Array.isArray(data.deals)) {

        function normalizeIngredient(name) {
            let lower = name.toLowerCase().trim();
            
            // Strip quantities and units first
            lower = lower
                .replace(/^[\d.\/\s]+/, '') // Leading numbers
                .replace(/\b(cups?|tbsp?|tsp?|oz|lb|lbs?|pound|pounds?|can|cans?|bag|bags?|box|boxes?|jar|jars?|bottle|bottles?|head|heads?|bunch|bunches?|cloves?|slices?|pieces?|large|medium|small|minced|diced|chopped|sliced|fresh|dried|frozen|canned|boneless|skinless|of)\b/gi, '')
                .replace(/\s+/g, ' ')
                .trim();
            
            // Check aliases
            for (const [key, aliases] of Object.entries(INGREDIENT_ALIASES)) {
                if (aliases.some(alias => lower.includes(alias) || alias.includes(lower))) {
                    return key;
                }
            }
            
            // If no alias found, return cleaned name
            return lower;
        }

        // Get ingredients the user ACTUALLY HAS (pantry only!)
        function getAvailableIngredients(pantry) {
            const available = new Set();
            pantry.forEach(item => available.add(normalizeIngredient(item.name)));
            // Always assume basic staples are available
            ['water', 'salt', 'oil'].forEach(i => available.add(i));
            return available;
        }
        
        // Get ingredients that are ON SALE (for shopping suggestions)
        function getDealIngredients(deals) {
            const onSale = new Set();
            deals.forEach(deal => onSale.add(normalizeIngredient(deal.item)));
            return onSale;
        }

        function recipeMatchesParams(recipe, params) {
            if (!recipe.dietaryFlags) return true; // Old recipe format
            if (params.dietType === 'vegan' && !recipe.dietaryFlags.includes('vegan')) return false;
            if (params.dietType === 'vegetarian' && !recipe.dietaryFlags.includes('vegetarian') && !recipe.dietaryFlags.includes('vegan')) return false;
            if (params.dietType === 'pescatarian' && !recipe.dietaryFlags.includes('vegetarian') && !recipe.dietaryFlags.includes('pescatarian') && !recipe.dietaryFlags.includes('vegan')) return false;
            if (params.gerdFriendly && !recipe.dietaryFlags.includes('gerd-safe')) return false;
            if (recipe.allergens) {
                for (const allergy of params.allergies) {
                    if (recipe.allergens.includes(allergy)) return false;
                }
            }
            if (params.proteinTarget === 'high' && recipe.proteinGrams && recipe.proteinGrams < 20) return false;
            
            // Complexity filtering - count steps in instructions
            if (params.maxComplexity && recipe.instructions) {
                const stepCount = (recipe.instructions.match(/\d+\./g) || []).length || 
                                  recipe.instructions.split('\n').filter(l => l.trim()).length;
                
                if (params.maxComplexity === 'easy' && stepCount > 3) return false;
                if (params.maxComplexity === 'medium' && stepCount > 6) return false;
                // 'complex' allows all
            }
            
            return true;
        }

        function findMatchingRecipes(recipes, pantry, deals, params) {
            const available = getAvailableIngredients(pantry);  // What you HAVE
            const onSale = getDealIngredients(deals);           // What's ON SALE
            
            return recipes
                .filter(recipe => recipeMatchesParams(recipe, params))
                .map(recipe => {
                    const recipeIngredients = recipe.ingredients.map(normalizeIngredient);
                    const matched = recipeIngredients.filter(ing => available.has(ing));
                    const missing = recipeIngredients.filter(ing => !available.has(ing));
                    
                    // Which missing ingredients have deals?
                    const missingWithDeals = missing.filter(ing => onSale.has(ing));
                    const missingNoDeals = missing.filter(ing => !onSale.has(ing));
                    
                    return {
                        ...recipe,
                        matchedIngredients: matched,
                        missingIngredients: missing,
                        missingWithDeals: missingWithDeals,
                        missingNoDeals: missingNoDeals,
                        matchPercentage: (matched.length / recipeIngredients.length) * 100,
                        canMake: missing.length === 0,  // ALL ingredients in pantry
                        almostCanMake: missing.length <= 2,  // Missing 1-2 from pantry
                        hasDealsForMissing: missingWithDeals.length > 0,  // Some missing items are on sale
                        allMissingOnSale: missing.length > 0 && missingNoDeals.length === 0,  // ALL missing items on sale
                    };
                })
                .sort((a, b) => {
                    // Sort: can make first, then almost can make with deals, then by match %
                    if (a.canMake !== b.canMake) return a.canMake ? -1 : 1;
                    if (a.almostCanMake !== b.almostCanMake) return a.almostCanMake ? -1 : 1;
                    if (a.allMissingOnSale !== b.allMissingOnSale) return a.allMissingOnSale ? -1 : 1;
                    return b.matchPercentage - a.matchPercentage;
                });
        }

        // VOICE INPUT - Continuous mic with AI parsing
        function GuidedVoiceInput({ onComplete, onBack }) {
            const [isRecording, setIsRecording] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [isParsing, setIsParsing] = useState(false);
            const [parsedItems, setParsedItems] = useState([]);
            const [error, setError] = useState('');
            const shouldRestart = useRef(false);
            const audioCtx = useRef(null);

            // Play a ding sound to confirm capture
            const playDing = () => {
                try {
                    if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                    const ctx = audioCtx.current;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 880;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.15);
                } catch (e) {}
            };

            // Setup speech callbacks
            useEffect(() => {
                window.guidedSpeechResult = (text) => {
                    console.log('Speech result:', text);
                    if (text) {
                        playDing(); // Ding to confirm we heard something
                        setTranscript(prev => prev ? prev + ' ' + text : text);
                    }
                    // Auto-restart if still recording
                    if (shouldRestart.current) {
                        setTimeout(() => {
                            if (shouldRestart.current && window.AndroidCamera) {
                                try {
                                    window.AndroidCamera.startSpeechRecognition('guidedSpeech');
                                } catch(e) {
                                    console.log('Restart failed:', e);
                                }
                            }
                        }, 300);
                    }
                };
                window.guidedSpeechError = (error) => {
                    console.log('Speech error:', error);
                    // Auto-restart on timeout/no-match if still recording
                    if (shouldRestart.current && (error === 'no-match' || error === 'timeout' || error === 'error')) {
                        setTimeout(() => {
                            if (shouldRestart.current && window.AndroidCamera) {
                                try {
                                    window.AndroidCamera.startSpeechRecognition('guidedSpeech');
                                } catch(e) {}
                            }
                        }, 300);
                    } else if (error === 'network') {
                        setError('Network error - check internet connection');
                        setIsRecording(false);
                        shouldRestart.current = false;
                    }
                };
                return () => {
                    shouldRestart.current = false;
                    if (window.AndroidCamera) {
                        try { window.AndroidCamera.stopSpeechRecognition(); } catch(e) {}
                    }
                };
            }, []);

            const startRecording = () => {
                if (window.AndroidCamera && window.AndroidCamera.hasSpeechSupport && window.AndroidCamera.hasSpeechSupport()) {
                    setError('');
                    shouldRestart.current = true;
                    setIsRecording(true);
                    window.AndroidCamera.startSpeechRecognition('guidedSpeech');
                } else {
                    setError('Speech recognition not available');
                }
            };

            const stopRecording = () => {
                shouldRestart.current = false;
                setIsRecording(false);

                    try { window.AndroidCamera.stopSpeechRecognition(); } catch(e) {}
                }
            };

            // Send to AI for parsing

                    });

                        setParsedItems(data.items.map((item, idx) => ({
                            ...item,
                            id: Date.now().toString() + '_' + idx
                        })));

                        setError('AI could not parse any items. Try again?');
                    }
                } catch (err) {
                    console.error('Parse error:', err);
                    setError('AI parsing failed: ' + err.message);
                }
                
                setIsParsing(false);
            };

            const addToPantry = () => {

                setParsedItems([]);
                setError('');

        function ReceiptScannerScreen({ onComplete, onBack, hideBackButton }) {
            const [photos, setPhotos] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [ocrProgress, setOcrProgress] = useState(0);
            const [statusMessage, setStatusMessage] = useState('');
            const [parsedItems, setParsedItems] = useState([]);
            const [rawText, setRawText] = useState('');
            const [showRawText, setShowRawText] = useState(false);
            const fileInputRef = useRef(null);

            // Handle file selection - auto-process immediately
            const handleFileSelect = async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;
                
                // Add photos to display
                const newPhotos = files.map(file => ({
                    id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                    file: file,
                    preview: URL.createObjectURL(file),
                    processed: false
                }));
                setPhotos(prev => [...prev, ...newPhotos]);
                
                // Auto-process
                await processPhotos([...photos, ...newPhotos]);
                
                e.target.value = '';
            };

            const removePhoto = (id) => {
                setPhotos(prev => prev.filter(p => p.id !== id));
            };

            // Process photos with OCR
            const processPhotos = async (photosToProcess) => {
                if (photosToProcess.length === 0) return;
                
                setIsProcessing(true);
                setOcrProgress(0);
                setStatusMessage('Loading OCR engine...');
                let allText = '';
                
                try {
                    // Check if Tesseract is available
                    if (typeof Tesseract === 'undefined') {
                        throw new Error('OCR library not loaded. Please check your internet connection.');
                    }
                    
                    setStatusMessage('Initializing OCR...');
                    
                    // Use simpler Tesseract API
                    for (let i = 0; i < photosToProcess.length; i++) {
                        const photo = photosToProcess[i];
                        setStatusMessage(`Scanning receipt ${i + 1} of ${photosToProcess.length}...`);
                        setOcrProgress(Math.round((i / photosToProcess.length) * 50));
                        
                        try {
                            const result = await Tesseract.recognize(photo.preview, 'eng', {
                                logger: m => {
                                    if (m.status === 'recognizing text') {
                                        const base = (i / photosToProcess.length) * 50;
                                        const add = (m.progress * 50) / photosToProcess.length;
                                        setOcrProgress(Math.round(base + add));
                                    }
                                }
                            });
                            
                            allText += result.data.text + '\n---\n';
                            
                            // Mark photo as processed
                            setPhotos(prev => prev.map(p => 
                                p.id === photo.id ? { ...p, processed: true } : p
                            ));
                        } catch (ocrErr) {
                            console.error('OCR error for photo:', ocrErr);
                            allText += `[Could not read image ${i + 1}]\n---\n`;
                        }
                    }

                    setRawText(allText);
                    setOcrProgress(60);
                    setStatusMessage('Parsing items...');
                    
                    // Parse the text
                    await parseReceiptText(allText);
                    
                    setOcrProgress(100);
                    setStatusMessage('Done!');
                    
                } catch (err) {
                    console.error('Processing failed:', err);
                    setStatusMessage('Error: ' + err.message);
                    alert('Failed to process receipt: ' + err.message);
                }
                
                setIsProcessing(false);
            };

            // Parse receipt text - try AI first, fallback to local
            const parseReceiptText = async (text) => {
                const backendUrl = getBackendUrl();
                
                // Try AI parsing if backend is configured
                if (backendUrl) {
                    try {
                        setStatusMessage('Using AI to extract items...');
                        const response = await fetch(backendUrl.replace(/\/$/, '') + '/parse-receipt', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ receiptText: text })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            if (data.items && data.items.length > 0) {
                                const seen = new Set();
                                const uniqueItems = data.items
                                    .filter(item => {
                                        const key = item.name.toLowerCase();
                                        if (seen.has(key)) return false;
                                        seen.add(key);
                                        return true;
                                    })
                                    .map((item, idx) => ({
                                        ...item,
                                        id: Date.now().toString() + '_' + idx
                                    }));
                                setParsedItems(uniqueItems);
                                return;
                            }
                        }
                    } catch (err) {
                        console.error('AI parse failed:', err);
                    }
                }
                
                // Fallback to local parsing
                setStatusMessage('Extracting items locally...');
                const items = parseReceiptLocally(text);
                setParsedItems(items);
            };

            // Local receipt parsing
            const parseReceiptLocally = (text) => {
                const items = [];
                const lines = text.split('\n');
                
                const ignorePatterns = [
                    /^(sub)?total/i, /^tax/i, /^change/i, /^cash/i, /^credit/i, /^debit/i,
                    /^balance/i, /^card/i, /^visa/i, /^mastercard/i, /^amex/i,
                    /^\d{2}\/\d{2}\/\d{2,4}/, /^\d{1,2}:\d{2}/,
                    /^thank you/i, /^have a/i, /^welcome/i,
                    /^store/i, /^address/i, /^phone/i, /^tel/i,
                    /^\*+$/, /^-+$/, /^=+$/,
                    /^#\d+/, /^order/i, /^receipt/i, /^transaction/i,
                    /savings/i, /discount/i, /coupon/i, /member/i
                ];

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed.length < 3) continue;
                    if (ignorePatterns.some(p => p.test(trimmed))) continue;
                    
                    // Look for price pattern
                    const priceMatch = trimmed.match(/^(.+?)\s+\$?(\d+\.\d{2})\s*[A-Z]?$/);
                    
                    if (priceMatch) {
                        let itemName = priceMatch[1].trim()
                            .replace(/^\d+\s*[@x]\s*/i, '')
                            .replace(/\s+\d+\s*(oz|lb|ct|pk|g|ml|l)\s*/gi, ' ')
                            .trim();
                        
                        if (itemName.length >= 2) {
                            let category = 'STAPLE';
                            const lower = itemName.toLowerCase();
                            
                            if (/chicken|beef|pork|turkey|salmon|fish|egg|bacon|sausage|meat|steak/i.test(lower)) {
                                category = 'PROTEIN';
                            } else if (/milk|cheese|yogurt|butter|cream|dairy/i.test(lower)) {
                                category = 'DAIRY';
                            } else if (/apple|banana|orange|lettuce|tomato|onion|potato|carrot|broccoli|fruit|vegetable|produce/i.test(lower)) {
                                category = 'PRODUCE';
                            } else if (/rice|pasta|bread|cereal|oat|flour|tortilla/i.test(lower)) {
                                category = 'ANCHOR';
                            }

                            items.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                                name: itemName.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' '),
                                qty: 1,
                                unit: '',
                                category: category,
                                expiry: '',
                                brand: ''
                            });
                        }
                    }
                }

                // Deduplicate
                const seen = new Set();
                return items.filter(item => {
                    const key = item.name.toLowerCase();
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
            };

            const updateParsedItem = (id, field, value) => {
                setParsedItems(items => items.map(item => 
                    item.id === id ? { ...item, [field]: value } : item
                ));
            };

            const removeParsedItem = (id) => {
                setParsedItems(items => items.filter(item => item.id !== id));
            };

            // Handle native camera photo
            const handleNativeCameraPhoto = async () => {
                const dataUrl = await openNativeCamera();
                if (dataUrl) {
                    const newPhoto = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                        preview: dataUrl,
                        processed: false

                    const updatedPhotos = [...photos, newPhoto];
                    setPhotos(updatedPhotos);
                    await processPhotos(updatedPhotos);
                }
            };
            
            // Handle native gallery photo
            const handleNativeGalleryPhoto = async () => {
                const dataUrl = await openNativeGallery();
                if (dataUrl) {
                    const newPhoto = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
                        preview: dataUrl,
                        processed: false
                    };
                    const updatedPhotos = [...photos, newPhoto];
                    setPhotos(updatedPhotos);
                    await processPhotos(updatedPhotos);
                }
            };

            const handleConfirm = () => {
                const validItems = parsedItems.filter(item => item.name.trim());
                onComplete(validItems);
            };

            return (
                <div>
                    {!hideBackButton && <button className="btn-back" onClick={onBack}>← Back</button>}
                    <h2>🧾 Receipt Scanner</h2>
                    <p style={{color:'#888', marginBottom:'20px'}}>
                        Photo your shopping receipt to auto-add items to pantry.
                    </p>

                    {/* Photo capture buttons */}
                    <div className="card-light">
                        <input 
                            type="file" 
                            accept="image/*"
                            onChange={handleFileSelect}
                            ref={fileInputRef}
                            style={{display:'none'}}
                        />
                        
                        {/* Show native camera buttons if in Android app */}
                        {isAndroidApp() ? (
                            <div style={{display:'flex', gap:'10px', marginBottom:'15px'}}>
                                <button 
                                    onClick={handleNativeCameraPhoto}
                                    style={{flex:1, padding:'20px', background:'#9c27b0', color:'white', fontSize:'1.1em'}}
                                    disabled={isProcessing}
                                >
                                    <i className="fas fa-camera"></i> Camera
                                </button>
                                <button 
                                    onClick={handleNativeGalleryPhoto}
                                    style={{flex:1, padding:'20px', background:'#673ab7', color:'white', fontSize:'1.1em'}}
                                    disabled={isProcessing}
                                >
                                    <i className="fas fa-images"></i> Gallery
                                </button>
                            </div>
                        ) : (
                            <button 
                                onClick={() => fileInputRef.current?.click()}
                                style={{width:'100%', padding:'20px', background:'linear-gradient(135deg, #9c27b0, #673ab7)', color:'white', fontSize:'1.1em', marginBottom:'15px'}}
                                disabled={isProcessing}

                                <i className="fas fa-camera"></i> {photos.length > 0 ? 'Add Another Photo' : 'Take Photo / Select from Gallery'}
                            </button>
                        )}

                        {/* Processing status */}
                        {isProcessing && (
                            <div style={{marginTop:'20px', padding:'15px', background:'#1a1a1a', borderRadius:'8px'}}>
                                <div style={{display:'flex', alignItems:'center', gap:'10px', marginBottom:'10px'}}>
                                    <i className="fas fa-spinner fa-spin" style={{color:'#9c27b0'}}></i>
                                    <span>{statusMessage}</span>
                                </div>
                                <div style={{background:'#333', borderRadius:'4px', height:'8px', overflow:'hidden'}}>
                                    <div style={{background:'#9c27b0', height:'100%', width:`${ocrProgress}%`, transition:'width 0.3s'}}></div>
                                </div>

                        {/* Photo previews */}

                                    {photos.map(photo => (

                                            {photo.processed && (

                                                    <i className="fas fa-check" style={{color:'white', fontSize:'10px'}}></i>
                                                </div>
                                            )}
                                            <button 
                                                onClick={() => removePhoto(photo.id)}
                                                style={{position:'absolute', top:'-5px', left:'-5px', background:'#f44336', border:'none', borderRadius:'50%', width:'18px', height:'18px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}

                                                <i className="fas fa-times" style={{color:'white', fontSize:'10px'}}></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                                
                                {/* Re-process button if needed */}
                                {parsedItems.length === 0 && (
                                    <button 
                                        onClick={() => processPhotos(photos)}
                                        style={{width:'100%', marginTop:'15px', padding:'12px', background:'#4caf50', color:'white'}}
                                    >
                                        <i className="fas fa-redo"></i> Re-scan Photos
                                    </button>
                                )}
                            </div>
                        )}

                        {photos.length === 0 && !isProcessing && (
                            <p style={{textAlign:'center', color:'#888', margin:'30px 0'}}>
                                <i className="fas fa-receipt" style={{fontSize:'2.5em', display:'block', marginBottom:'15px', opacity:0.5}}></i>
                                Snap your receipt after shopping.<br/>
                                Items will be extracted automatically.
                            </p>
                        )}
                    </div>

                    {/* Raw OCR toggle */}
                    {rawText && (
                        <div style={{marginTop:'15px'}}>
                            <button onClick={() => setShowRawText(!showRawText)} style={{background:'none', color:'#888', fontSize:'0.9em'}}>
                                <i className={`fas fa-${showRawText ? 'eye-slash' : 'eye'}`}></i>
                                {showRawText ? ' Hide' : ' Show'} raw text
                            </button>
                            {showRawText && (
                                <pre style={{background:'#1a1a1a', padding:'10px', borderRadius:'8px', fontSize:'0.75em', maxHeight:'150px', overflow:'auto', whiteSpace:'pre-wrap', color:'#aaa'}}>
                                    {rawText}
                                </pre>
                            )}
                        </div>
                    )}

                    {/* Parsed items */}
                    {parsedItems.length > 0 && (
                        <div className="card-light" style={{marginTop:'15px'}}>
                            <h4 style={{marginTop:0}}>
                                <i className="fas fa-shopping-bag" style={{color:'#9c27b0'}}></i> Found {parsedItems.length} Items
                            </h4>
                            
                            {parsedItems.map(item => (
                                <div key={item.id} style={{display:'flex', alignItems:'center', gap:'10px', padding:'10px', background:'#1a1a1a', borderRadius:'8px', marginBottom:'8px'}}>
                                    <div style={{flex:1}}>
                                        <input 
                                            value={item.name} 
                                            onChange={e => updateParsedItem(item.id, 'name', e.target.value)}
                                            style={{width:'100%', marginBottom:'5px'}}
                                        />
                                        <div style={{display:'flex', gap:'5px'}}>
                                            <input 
                                                value={item.qty} 
                                                onChange={e => updateParsedItem(item.id, 'qty', e.target.value)}

                                            />
                                            <select 
                                                value={item.category} 
                                                onChange={e => updateParsedItem(item.id, 'category', e.target.value)}
                                                style={{flex:1}}
                                            >
                                                <option value="ANCHOR">Anchor</option>

                                        <i className="fas fa-trash" style={{color:'#f44336'}}></i>
                                    </button>
                                </div>
                            ))}
                            
                            <div style={{display:'flex', gap:'10px', marginTop:'15px'}}>
                                <button onClick={() => setParsedItems([])} style={{flex:1, padding:'12px', background:'#333', color:'white'}}>
                                    Clear

            const addItem = () => {

                setPantry([...pantry, { ...newItem, id: Date.now().toString() }]);
                setNewItem({ name: '', category: 'STAPLE', qty: 1, unit: '', expiry: '' });
            };

            const handleVoiceComplete = (items) => {
                setPantry([...pantry, ...items]);
                setShowVoiceInput(false);
            };

            const handleReceiptComplete = (items) => {
                // Deduplicate against existing pantry items
                const existingNames = new Set(pantry.map(p => p.name.toLowerCase()));
                const newItems = items.filter(item => !existingNames.has(item.name.toLowerCase()));
                setPantry([...pantry, ...newItems]);

            const getDaysUntilExpiry = (dateStr) => {
                if (!dateStr) return 999;
                const today = new Date();
                let expiry;
                
                // Handle YYYY-MM format (month picker)
                if (dateStr.length === 7) {
                    // Use last day of the month
                    const [year, month] = dateStr.split('-').map(Number);
                    expiry = new Date(year, month, 0); // Day 0 of next month = last day of this month
                } else {
                    expiry = new Date(dateStr);
                }
                
                return Math.ceil((expiry - today) / (1000 * 60 * 60 * 24));
            };

                return <VoiceInputScreen onComplete={handleVoiceComplete} onBack={() => setShowVoiceInput(false)} />;
            }

                    >
                        <i className="fas fa-microphone"></i> Voice Input (Speak Your Items)
                    </button>
                    
                    {/* RECEIPT SCANNER BUTTON */}

                        onClick={() => setShowReceiptScanner(true)}
