                                        <h2 style={{color:'#4caf50', margin:'0 0 10px'}}>What's in Your Pantry?</h2>
                                        <p style={{color:'#888'}}>
                                            Add items you already have at home. Choose how to add them:
                                        </p>
                                    </div>
                                    
                                    {/* Input method selection */}
                                    {!onboardingPantryMode && (
                                        <div style={{display:'flex', flexDirection:'column', gap:'15px'}}>
                                            <button 
                                                onClick={() => setOnboardingPantryMode('voice')}
                                                style={{padding:'25px', background:'linear-gradient(135deg, #f44336, #e91e63)', color:'white', fontSize:'1.1em', display:'flex', alignItems:'center', justifyContent:'center', gap:'15px'}}
                                            >
                                                <i className="fas fa-microphone" style={{fontSize:'1.5em'}}></i>
                                                <div style={{textAlign:'left'}}>
                                                    <strong>Voice Input</strong>
                                                    <div style={{fontSize:'0.8em', opacity:0.9}}>Speak your items out loud</div>
                                                </div>
                                            </button>
                                            
                                            <button 
                                                onClick={() => setOnboardingPantryMode('receipt')}
                                                style={{padding:'25px', background:'linear-gradient(135deg, #9c27b0, #673ab7)', color:'white', fontSize:'1.1em', display:'flex', alignItems:'center', justifyContent:'center', gap:'15px'}}
                                            >
                                                <i className="fas fa-receipt" style={{fontSize:'1.5em'}}></i>
                                                <div style={{textAlign:'left'}}>
                                                    <strong>Scan Receipt</strong>
                                                    <div style={{fontSize:'0.8em', opacity:0.9}}>Photo your shopping receipt</div>
                                                </div>
                                            </button>
                                            
                                            <div style={{textAlign:'center', color:'#888', margin:'10px 0'}}>or</div>
                                            
                                            <button 
                                                onClick={() => setOnboardingStep(2)}
                                                style={{padding:'15px', background:'transparent', border:'1px solid #666', color:'#888'}}
                                            >
                                                Skip for now →
                                            </button>
                                        </div>
                                    )}
                                    
                                    {/* Voice input mode */}
                                    {onboardingPantryMode === 'voice' && (
                                        <>
                                            <VoiceInputScreen 
                                                onComplete={(items) => {
                                                    setPantry(prev => [...prev, ...items.map(item => ({
                                                        ...item,
                                                        id: Date.now().toString() + Math.random().toString(36).substr(2, 9)
                                                    }))]);
                                                }}
                                                onBack={() => setOnboardingPantryMode(null)}
                                                hideBackButton={true}
                                            />
                                            <div style={{marginTop:'15px', display:'flex', gap:'10px'}}>
                                                <button 
                                                    onClick={() => setOnboardingPantryMode(null)}
                                                    style={{flex:1, padding:'12px', background:'#333', color:'white'}}
                                                >
                                                    <i className="fas fa-arrow-left"></i> Back
                                                </button>
                                                <button 
                                                    onClick={() => setOnboardingStep(2)}
                                                    style={{flex:1, padding:'12px', background:'#666', color:'white'}}
                                                >
                                                    Skip to Deals <i className="fas fa-arrow-right"></i>
                                                </button>
                                            </div>
                                        </>
                                    )}
                                    
                                    {/* Receipt scanner mode */}
                                    {onboardingPantryMode === 'receipt' && (
                                        <>
                                            <ReceiptScannerScreen 
                                                onComplete={(items) => {
                                                    const existingNames = new Set(pantry.map(p => p.name.toLowerCase()));
                                                    const newItems = items.filter(item => !existingNames.has(item.name.toLowerCase()));
                                                    setPantry(prev => [...prev, ...newItems]);
                                                    setOnboardingPantryMode(null);
                                                }}
                                                onBack={() => setOnboardingPantryMode(null)}
                                                hideBackButton={true}
                                            />
                                            <div style={{marginTop:'15px', display:'flex', gap:'10px'}}>
                                                <button 
                                                    onClick={() => setOnboardingPantryMode(null)}
                                                    style={{flex:1, padding:'12px', background:'#333', color:'white'}}
                                                >
                                                    <i className="fas fa-arrow-left"></i> Back
                                                </button>
                                                <button 
                                                    onClick={() => setOnboardingStep(2)}
                                                    style={{flex:1, padding:'12px', background:'#666', color:'white'}}
                                                >
                                                    Skip to Deals <i className="fas fa-arrow-right"></i>
                                                </button>
                                            </div>
                                        </>
                                    )}
                                    
                                    {/* Navigation buttons - only show when not in a mode or items added */}
                                    {(pantry.length > 0 || !onboardingPantryMode) && onboardingPantryMode !== 'voice' && onboardingPantryMode !== 'receipt' && (
                                        <div style={{marginTop:'20px', display:'flex', gap:'10px'}}>
                                            <button 
                                                onClick={() => setOnboardingStep(0)}
                                                style={{flex:1, padding:'15px', background:'#333', color:'white'}}
                                            >
                                                <i className="fas fa-arrow-left"></i> Back
                                            </button>
                                            <button 
                                                onClick={() => setOnboardingStep(2)}
                                                style={{flex:2, padding:'15px', background: pantry.length > 0 ? '#4caf50' : '#666', color:'white'}}
                                            >
                                                {pantry.length > 0 ? `Continue with ${pantry.length} items` : 'Skip for now'} <i className="fas fa-arrow-right"></i>
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                            
                            {/* Step 2: Scan Deals */}
                            {onboardingStep === 2 && (
                                <div>
                                    <div style={{textAlign:'center', marginBottom:'20px'}}>
                                        <div style={{display:'inline-block', background:'#4caf50', color:'white', padding:'5px 15px', borderRadius:'20px', fontSize:'0.9em'}}>
                                            Step 2 of 4
                                        </div>
                                    </div>
                                    <div className="card" style={{textAlign:'center', marginBottom:'20px'}}>
                                        <div style={{fontSize:'3em', marginBottom:'15px'}}>🏷️</div>
                                        <h2 style={{color:'#ff9800', margin:'0 0 10px'}}>Scan This Week's Deals</h2>
                                        <p style={{color:'#888'}}>
                                            Take a photo of your grocery store's flyer. We'll extract the deals automatically.
                                        </p>
                                    </div>
                                    
                                    <DealsScreen 
                                        deals={deals} 
                                        setDeals={setDeals} 
                                        onBack={() => setOnboardingStep(1)}
                                        onDealsScanned={() => setOnboardingStep(3)}
                                        hideBackButton={true}
                                    />
                                    
                                    <div style={{marginTop:'20px', display:'flex', gap:'10px'}}>
                                        <button 
                                            onClick={() => setOnboardingStep(1)}
                                            style={{flex:1, padding:'15px', background:'#333', color:'white'}}
                                        >
                                            <i className="fas fa-arrow-left"></i> Back
                                        </button>
                                        <button 
                                            onClick={() => setOnboardingStep(3)}
                                            style={{flex:2, padding:'15px', background: deals.length > 0 ? '#4caf50' : '#666', color:'white'}}
                                        >
                                            {deals.length > 0 ? `Continue with ${deals.length} deals` : 'Skip for now'} <i className="fas fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            )}
                            
                            {/* Step 3: Recipe Discovery */}
                            {onboardingStep === 3 && (
                                <div>
                                    <div style={{textAlign:'center', marginBottom:'20px'}}>
                                        <div style={{display:'inline-block', background:'#4caf50', color:'white', padding:'5px 15px', borderRadius:'20px', fontSize:'0.9em'}}>
                                            Step 3 of 4
                                        </div>
                                    </div>
                                    <div className="card" style={{textAlign:'center', marginBottom:'20px'}}>
                                        <div style={{fontSize:'3em', marginBottom:'15px'}}>🍳</div>
                                        <h2 style={{color:'#2196f3', margin:'0 0 10px'}}>Discover New Recipes!</h2>
                                        <p style={{color:'#888'}}>
                                            Based on your pantry and deals, here are recipes you can make. Swipe right to keep, left to skip.
                                        </p>
                                    </div>
                                    
                                    <RecipeDiscoveryScreen 
                                        pantry={pantry}
                                        deals={deals}
                                        params={params}
                                        recipes={recipes}
                                        setRecipes={setRecipes}
                                        onClose={() => setOnboardingStep(4)}
                                        onFinishWithPlan={(newPlan, newRecipes) => {
                                            setPlan(newPlan);
                                            setRecipes(prev => [...prev, ...newRecipes]);
                                            setOnboardingStep(4);
                                        }}
                                    />
                                    
                                    <div style={{marginTop:'20px', display:'flex', gap:'10px'}}>
                                        <button 
                                            onClick={() => setOnboardingStep(2)}
                                            style={{flex:1, padding:'15px', background:'#333', color:'white'}}
                                        >
                                            <i className="fas fa-arrow-left"></i> Back
                                        </button>
                                        <button 
                                            onClick={() => setOnboardingStep(4)}
                                            style={{flex:1, padding:'15px', background:'#666', color:'white'}}
                                        >
                                            Skip to Finish <i className="fas fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            )}
                            
                            {/* Step 4: First Plan + Finish */}
                            {onboardingStep === 4 && (
                                <div className="card" style={{textAlign:'center'}}>
                                    <div style={{fontSize:'4em', marginBottom:'20px'}}>🎉</div>
                                    <h1 style={{color:'#4caf50', margin:'0 0 15px'}}>You're All Set!</h1>
                                    <p style={{color:'#888', fontSize:'1.1em', marginBottom:'25px'}}>
                                        Your meal plan is ready. Here's what you can do next:
                                    </p>
                                    
                                    <div style={{textAlign:'left', background:'#1a1a1a', padding:'20px', borderRadius:'12px', marginBottom:'25px'}}>
                                        <div style={{marginBottom:'15px', display:'flex', alignItems:'center', gap:'10px'}}>
                                            <i className="fas fa-calendar-alt" style={{color:'#4caf50'}}></i>
                                            <span>View your {params.planDurationDays}-day meal plan</span>
                                        </div>
                                        <div style={{marginBottom:'15px', display:'flex', alignItems:'center', gap:'10px'}}>
                                            <i className="fas fa-shopping-cart" style={{color:'#ff9800'}}></i>
                                            <span>Generate a shopping list</span>
                                        </div>
                                        <div style={{marginBottom:'15px', display:'flex', alignItems:'center', gap:'10px'}}>
                                            <i className="fas fa-exchange-alt" style={{color:'#2196f3'}}></i>
                                            <span>Swap recipes you don't like</span>
                                        </div>
                                        <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
                                            <i className="fas fa-cog" style={{color:'#888'}}></i>
                                            <span>Adjust your preferences anytime</span>
                                        </div>
                                    </div>
                                    
                                    <div style={{background:'#1a3a1a', border:'1px solid #4caf50', padding:'15px', borderRadius:'12px', marginBottom:'20px'}}>
                                        <div style={{fontSize:'0.9em', color:'#888'}}>Your stats:</div>
                                        <div style={{fontSize:'1.2em', color:'#4caf50', marginTop:'5px'}}>
                                            🏠 {pantry.length} pantry items • 🏷️ {deals.length} deals • 📖 {recipes.length} recipes
                                        </div>
                                    </div>
                                    
                                    <button 
                                        onClick={() => {
                                            completeOnboarding();
                                            setScreenHistory(['HOME']);
                                            setScreen('HOME');
                                        }}
                                        style={{width:'100%', padding:'18px', background:'linear-gradient(135deg, #4caf50, #2e7d32)', color:'white', fontSize:'1.2em'}}
                                    >
                                        Start Using Deal Planner! <i className="fas fa-arrow-right"></i>
                                    </button>
                                    
                                    <button 
                                        onClick={() => {
                                            if (!plan) generatePlan();
                                            completeOnboarding();
                                            setScreenHistory(['HOME', 'PLAN']);
                                            setScreen('PLAN');
                                        }}
                                        style={{width:'100%', padding:'12px', background:'transparent', color:'#888', marginTop:'10px', border:'1px solid #4caf50'}}
                                    >
                                        Generate Meal Plan Now
                                    </button>
                                </div>
                            )}
                        </div>
                    )}
                    
                    {/* MAIN APP (only show if onboarding complete) */}
                    {onboardingStep === null && screen === 'HOME' && (
                        <>
                            <h1 style={{color:'#4caf50', textAlign:'center'}}>🍱 Deal Planner v6.19</h1>
                            
                            <div className="card">
                                <h3 style={{margin:0, color:'#ffcc80'}}>💰 Budget: ${params.monthlyBudget}/mo</h3>
                                <div style={{fontSize:'0.85em', color:'#888', marginTop:'5px'}}>
                                    Diet: {params.dietType} | {params.planDurationDays}-day plans | 🏠 {pantry.length} pantry items
                                </div>
                            </div>

                            {/* Recipe Status - Clickable */}
                            <div 
                                className="card" 
                                onClick={() => (canMakeCount > 0 || canMakeWithDealsCount > 0 || almostCanMakeCount > 0) && navigateTo('READY_RECIPES')}
                                style={{
                                    background: canMakeCount > 0 ? '#1a3a1a' : (canMakeWithDealsCount > 0 ? '#1a2a3a' : '#3a1a1a'), 
                                    borderColor: canMakeCount > 0 ? '#4caf50' : (canMakeWithDealsCount > 0 ? '#2196f3' : (almostCanMakeCount > 0 ? '#ff9800' : '#f44336')),
                                    cursor: (canMakeCount > 0 || canMakeWithDealsCount > 0 || almostCanMakeCount > 0) ? 'pointer' : 'default'
                                }}
                            >
                                <div style={{display:'flex', alignItems:'center', gap:'10px'}}>
                                    <span style={{fontSize:'2em'}}>🍳</span>
                                    <div style={{flex:1}}>
                                        <div style={{fontWeight:'bold', color: canMakeCount > 0 ? '#4caf50' : (canMakeWithDealsCount > 0 ? '#2196f3' : (almostCanMakeCount > 0 ? '#ff9800' : '#f44336'))}}>
                                            {canMakeCount > 0 
                                                ? `You can make ${canMakeCount} recipes right now!` 
                                                : (canMakeWithDealsCount > 0 
                                                    ? `${canMakeWithDealsCount} recipes - just buy the deals!`
                                                    : (almostCanMakeCount > 0 
                                                        ? `${almostCanMakeCount} recipes almost ready`
                                                        : 'Add pantry items first'))}
                                        </div>
                                        <div style={{fontSize:'0.85em', color:'#888'}}>
                                            {canMakeCount > 0 
                                                ? 'Based on your pantry items'
                                                : (canMakeWithDealsCount > 0 
                                                    ? 'Missing items are all on sale'
                                                    : (almostCanMakeCount > 0 
                                                        ? 'Just missing 1-2 items each'
                                                        : 'Pantry is empty - add items to start'))}
                                        </div>
                                    </div>
                                    {(canMakeCount > 0 || canMakeWithDealsCount > 0 || almostCanMakeCount > 0) && 
                                        <i className="fas fa-chevron-right" style={{color: canMakeCount > 0 ? '#4caf50' : (canMakeWithDealsCount > 0 ? '#2196f3' : '#ff9800')}}></i>}
                                </div>
                                
                                {/* Show pantry status if empty */}
                                {pantry.length === 0 && (
                                    <div style={{marginTop:'15px', paddingTop:'15px', borderTop:'1px solid #444'}}>
                                        <div style={{fontSize:'0.9em', color:'#ff9800', textAlign:'center'}}>
                                            <i className="fas fa-exclamation-triangle"></i> Your pantry is empty!
                                        </div>
                                        <div style={{fontSize:'0.85em', color:'#888', textAlign:'center', marginTop:'5px'}}>
                                            Add items via Voice Input or Receipt Scanner
                                        </div>
                                    </div>
                                )}
                                
                                {/* Missing ingredient suggestions */}
                                {missingSuggestions.length > 0 && canMakeCount < 5 && pantry.length > 0 && (
                                    <div style={{marginTop:'15px', paddingTop:'15px', borderTop:'1px solid #444'}}>
                                        <div style={{fontSize:'0.85em', color:'#888', marginBottom:'8px'}}>
                                            <i className="fas fa-lightbulb" style={{color:'#ffd54f'}}></i> Add these to unlock more recipes:
                                        </div>
                                        <div style={{display:'flex', flexWrap:'wrap', gap:'8px'}}>
                                            {missingSuggestions.map((s, i) => (
                                                <span key={i} style={{
                                                    background:'#2a2a2a', 
                                                    padding:'5px 10px', 
                                                    borderRadius:'15px', 
                                                    fontSize:'0.85em',
                                                    color:'#fff'
                                                }}>
                                                    {s.ingredient} <span style={{color:'#4caf50'}}>+{s.unlocksCount}</span>
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {couponsToClip.length > 0 && (
                                <div className="coupon-checklist" onClick={() => navigateTo('DEALS')} style={{cursor:'pointer'}}>
                                    <strong><i className="fas fa-cut"></i> {couponsToClip.length} Coupon(s) to Clip!</strong>
                                    <div style={{fontSize:'0.85em', marginTop:'5px'}}>Tap to view in Deals</div>
                                </div>
                            )}

                            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'15px'}}>
                                <button className="btn-nav" onClick={() => navigateTo('PANTRY')}><i className="fas fa-home fa-2x"></i> Pantry<span style={{fontSize:'0.7em', display:'block', marginTop:'5px'}}>{pantry.length} items</span></button>
                                <button className="btn-nav" onClick={() => navigateTo('DEALS')}>
                                    <i className="fas fa-tags fa-2x"></i> Deals
                                    {couponsToClip.length > 0 && <span style={{background:'#f44336', color:'white', borderRadius:'50%', padding:'2px 8px', fontSize:'0.7em', marginLeft:'5px'}}>{couponsToClip.length}</span>}
                                    <span style={{fontSize:'0.7em', display:'block', marginTop:'5px'}}>{deals.length} active</span>
                                </button>
                                <button className="btn-nav" onClick={() => navigateTo('RECIPES')}><i className="fas fa-book fa-2x"></i> Recipe Library<span style={{fontSize:'0.7em', display:'block', marginTop:'5px'}}>{recipes.length} saved</span></button>
                                <button className="btn-nav" onClick={() => navigateTo('SHOPPING_LIST')} style={{background: shoppingList.length > 0 ? '#e65100' : '#333'}}>
                                    <i className="fas fa-shopping-cart fa-2x"></i> Shopping List
                                    <span style={{fontSize:'0.7em', display:'block', marginTop:'5px'}}>{shoppingList.length} items</span>
                                </button>
                                <button className="btn-nav" onClick={() => navigateTo('PARAMS')} style={{background:'#1a237e', gridColumn:'span 2'}}><i className="fas fa-sliders-h fa-2x"></i> Parameters</button>
                                
                                {/* Discover Recipes Button */}
                                <button 
                                    onClick={() => setShowDiscovery(true)}
                                    style={{gridColumn:'span 2', padding:'15px', background:'linear-gradient(135deg, #e91e63, #9c27b0)', color:'white', fontSize:'1em'}}
                                >
                                    <i className="fas fa-magic"></i> 🍳 Discover New Recipes
                                    <span style={{fontSize:'0.75em', display:'block', marginTop:'3px', opacity:0.9}}>AI generates recipes from your ingredients</span>
                                </button>
                                
                                <button 
                                    onClick={() => { 
                                        if (plan) {
                                            if (confirm('⚠️ This will replace your current meal plan. Continue?')) {
                                                generatePlan(); 
                                                navigateTo('PLAN'); 
                                            }
                                        } else {
                                            generatePlan(); 
                                            navigateTo('PLAN'); 
                                        }
                                    }} 
                                    style={{gridColumn:'span 2', padding:'20px', background:'linear-gradient(135deg, #4caf50, #2e7d32)', color:'white', fontSize:'1.1em'}}
                                >
                                    🎲 I'm Feeling Lucky
                                    <span style={{fontSize:'0.75em', display:'block', marginTop:'3px', opacity:0.9}}>{plan ? 'Regenerate' : 'Generate'} {params.planDurationDays}-Day Plan</span>
                                </button>
                                {plan && (
                                    <button 
                                        onClick={() => navigateTo('PLAN')} 
                                        style={{gridColumn:'span 2', padding:'15px', background:'#333', color:'white', fontSize:'1em'}}
                                    >
                                        👁️ View Current Plan
                                    </button>
                                )}
                            </div>
                        </>
                    )}

                    {onboardingStep === null && screen === 'PANTRY' && <PantryScreen pantry={pantry} setPantry={setPantry} onBack={goHome} />}
                    {onboardingStep === null && screen === 'DEALS' && <DealsScreen deals={deals} setDeals={setDeals} onBack={goHome} onDealsScanned={() => setShowDiscovery(true)} />}
                    {onboardingStep === null && screen === 'RECIPES' && <RecipesScreen recipes={recipes} setRecipes={setRecipes} pantry={pantry} deals={deals} onBack={goHome} onRequestSwap={handleRecipeSwapRequest} swapState={swapState} />}
                    {onboardingStep === null && screen === 'READY_RECIPES' && <ReadyRecipesScreen matchingRecipes={matchingRecipes} recipes={recipes} setRecipes={setRecipes} onBack={goHome} onRequestSwap={handleRecipeSwapRequest} swapState={swapState} />}
                    {onboardingStep === null && screen === 'PLAN' && <PlanScreen plan={plan} setPlan={setPlan} recipes={recipes} setRecipes={setRecipes} pantry={pantry} deals={deals} params={params} onBack={goHome} onRegenerate={generatePlan} onInitiateSwapFromPlan={handlePlanSwapInitiate} swapState={swapState} shoppingList={shoppingList} setShoppingList={setShoppingList} />}
                    {onboardingStep === null && screen === 'PARAMS' && <ParametersScreen params={params} setParams={setParams} onBack={goHome} resetOnboarding={resetOnboarding} />}
                    {onboardingStep === null && screen === 'SHOPPING_LIST' && <ShoppingListScreen shoppingList={shoppingList} setShoppingList={setShoppingList} plan={plan} pantry={pantry} deals={deals} params={params} onBack={goHome} onGenerateFromPlan={generateShoppingListFromPlan} />}
                    
                    {/* Recipe Discovery Modal */}
                    {showDiscovery && (
                        <RecipeDiscoveryScreen 
                            pantry={pantry}
                            deals={deals}
                            params={params}
                            recipes={recipes}
                            setRecipes={setRecipes}
                            onClose={() => setShowDiscovery(false)}
                            onFinishWithPlan={(keptRecipes) => {
                                setShowDiscovery(false);
                                generatePlanWithNewRecipes(keptRecipes);
                                setScreen('PLAN');
                            }}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
